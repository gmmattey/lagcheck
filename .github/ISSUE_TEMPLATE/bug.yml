name: Bug
description: Algo não funcionou como esperado
labels: [bug]
body:
  - type: dropdown
    id: plataforma
    attributes:
      label: Plataforma
      options: [iPhone, Android, Windows (prévia), Worker]
    validations:
      required: true
  - type: input
    id: versao
    attributes:
      label: Versão do app e do sistema
      placeholder: "1.0.4 (11), iOS 18.1"
    validations:
      required: true
  - type: textarea
    id: o-que-houve
    attributes:
      label: O que aconteceu
      description: O que você esperava e o que viu. Não cole dados pessoais.
    validations:
      required: true
  - type: textarea
    id: passos
    attributes:
      label: Como reproduzir
