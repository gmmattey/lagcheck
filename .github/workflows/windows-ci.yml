name: Lagcheck Windows CI

on:
  pull_request:
    paths:
      - "apps/windows/**"
      - "apps/android/engine-host/**"
      - "apps/android/desktop/**"
      - "apps/android/core/domain/**"
      - ".github/workflows/windows-ci.yml"
  push:
    branches: [main]
    paths:
      - "apps/windows/**"
      - "apps/android/engine-host/**"
      - "apps/android/desktop/**"
      - "apps/android/core/domain/**"
      - ".github/workflows/windows-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-validate:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Run WinUI unit & protocol contract tests
        run: dotnet test apps/windows/LagCheck.WinUI.Tests/LagCheck.WinUI.Tests.csproj --configuration Release --verbosity normal

      - name: Build WinUI 3 application (x64)
        run: dotnet build apps/windows/LagCheck.WinUI/LagCheck.WinUI.csproj --configuration Release -p:Platform=x64

      - name: Run engine-host and desktop unit tests
        working-directory: apps/android
        run: .\gradlew.bat :engine-host:test :desktop:test --console=plain
