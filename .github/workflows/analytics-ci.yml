name: Lagcheck Web & Worker CI

on:
  pull_request:
    paths:
      - "apps/worker/**"
      - "shared/scripts/**"
      - ".github/workflows/analytics-ci.yml"
  push:
    branches: [main]
    paths:
      - "apps/worker/**"
      - "shared/scripts/**"
      - ".github/workflows/analytics-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/worker/package-lock.json
      - name: Install Worker dev dependencies
        run: npm ci --prefix apps/worker
      - name: Worker unit tests (including Vercel/Discord)
        run: npm test --prefix apps/worker
