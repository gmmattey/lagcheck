name: Android Play Console Beta (Alpha)

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: "Versão do produto (X.Y, ex.: 1.3)"
        required: true
        default: "1.3"
        type: string
      track:
        description: "Track do Google Play Console (alpha mantém anúncios obrigatoriamente desativados)"
        required: true
        default: "alpha"
        type: choice
        options:
          - alpha
          - internal
          - beta
      channel:
        description: "Ambiente GA4 embutido no AAB (testing para validação, production para loja)"
        required: true
        default: "testing"
        type: choice
        options:
          - testing
          - production
      release_status:
        description: "Status do release no Play Console"
        required: true
        default: "completed"
        type: choice
        options:
          - completed
          - draft
      enable_ads_non_alpha:
        description: "Ativar anúncios AdMob (ignorado e mantido DESATIVADO na trilha alpha)"
        required: false
        default: false
        type: boolean
      release_notes:
        description: "Destaques comerciais opcionais (em branco gera diff comercial automático)"
        required: false
        default: ""
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: android-play-release
  cancel-in-progress: false

jobs:
  publish-alpha:
    name: Build, Test & Publish (${{ inputs.track }})
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Resolve AdMob policy per Play track
        id: policy
        run: |
          TRACK="${{ inputs.track }}"
          ENABLE_NON_ALPHA="${{ inputs.enable_ads_non_alpha }}"
          if [ "$TRACK" = "alpha" ]; then
            ADS_ENABLED="false"
            echo "Trilha alpha na Google Play: anúncios AdMob desativados (ADS_ENABLED=false)."
          elif [ "$ENABLE_NON_ALPHA" = "true" ]; then
            ADS_ENABLED="true"
            echo "Trilha ${TRACK}: anúncios AdMob ativados explicitamente (ADS_ENABLED=true)."
          else
            ADS_ENABLED="false"
            echo "Trilha ${TRACK}: anúncios AdMob desativados (ADS_ENABLED=false)."
          fi
          echo "ads_enabled=${ADS_ENABLED}" >> "$GITHUB_OUTPUT"

      - name: Run Android unit tests
        working-directory: apps/android
        run: |
          ./gradlew :core:domain:test :core:catalog:test :core:network:test :core:session:test :app:testValidationDebugUnitTest --no-daemon

      - name: Configure upload signing key and AdMob properties
        env:
          ADS_ENABLED: ${{ steps.policy.outputs.ads_enabled }}
          ANDROID_UPLOAD_KEYSTORE_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
          ANDROID_UPLOAD_STORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_STORE_PASSWORD }}
          ANDROID_UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          ANDROID_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
          ADMOB_APP_ID: ${{ secrets.ADMOB_APP_ID }}
          ADMOB_NATIVE_HOME_UNIT_ID: ${{ secrets.ADMOB_NATIVE_HOME_UNIT_ID }}
          ADMOB_NATIVE_HISTORY_UNIT_ID: ${{ secrets.ADMOB_NATIVE_HISTORY_UNIT_ID }}
          ADMOB_NATIVE_GAMES_UNIT_ID: ${{ secrets.ADMOB_NATIVE_GAMES_UNIT_ID }}
          ADMOB_NATIVE_RESULT_UNIT_ID: ${{ secrets.ADMOB_NATIVE_RESULT_UNIT_ID }}
        run: |
          if [ -z "$ANDROID_UPLOAD_KEYSTORE_BASE64" ] || [ -z "$ANDROID_UPLOAD_STORE_PASSWORD" ] || [ -z "$ANDROID_UPLOAD_KEY_ALIAS" ] || [ -z "$ANDROID_UPLOAD_KEY_PASSWORD" ]; then
            echo "Erro: configure os secrets ANDROID_UPLOAD_KEYSTORE_BASE64, ANDROID_UPLOAD_STORE_PASSWORD, ANDROID_UPLOAD_KEY_ALIAS e ANDROID_UPLOAD_KEY_PASSWORD." >&2
            exit 1
          fi

          mkdir -p shared/distribution/release/keys
          printf '%s' "$ANDROID_UPLOAD_KEYSTORE_BASE64" | base64 --decode > shared/distribution/release/keys/lagcheck-upload.jks
          cat > shared/distribution/release/keys/lagcheck-upload.properties <<EOF
          storeFile=lagcheck-upload.jks
          storePassword=$ANDROID_UPLOAD_STORE_PASSWORD
          keyAlias=$ANDROID_UPLOAD_KEY_ALIAS
          keyPassword=$ANDROID_UPLOAD_KEY_PASSWORD
          EOF

          if [ "$ADS_ENABLED" = "true" ]; then
            if [ -z "$ADMOB_APP_ID" ] || [ -z "$ADMOB_NATIVE_HOME_UNIT_ID" ] || [ -z "$ADMOB_NATIVE_HISTORY_UNIT_ID" ] || [ -z "$ADMOB_NATIVE_GAMES_UNIT_ID" ] || [ -z "$ADMOB_NATIVE_RESULT_UNIT_ID" ]; then
              echo "Erro: anúncios ativados exigem todos os secrets ADMOB_* configurados." >&2
              exit 1
            fi
            mkdir -p "$HOME/.gradle"
            {
              echo "lagcheck.admobAppId=$ADMOB_APP_ID"
              echo "lagcheck.admobNativeHomeUnitId=$ADMOB_NATIVE_HOME_UNIT_ID"
              echo "lagcheck.admobNativeHistoryUnitId=$ADMOB_NATIVE_HISTORY_UNIT_ID"
              echo "lagcheck.admobNativeGamesUnitId=$ADMOB_NATIVE_GAMES_UNIT_ID"
              echo "lagcheck.admobNativeResultUnitId=$ADMOB_NATIVE_RESULT_UNIT_ID"
            } >> "$HOME/.gradle/gradle.properties"
          else
            echo "Anúncios desativados: IDs de produção AdMob não injetados neste build."
          fi

      - name: Build and verify signed AAB
        id: build
        env:
          ADS_ENABLED: ${{ steps.policy.outputs.ads_enabled }}
          LAGCHECK_BUILD_OFFSET: ${{ vars.LAGCHECK_BUILD_OFFSET || '8' }}
        run: |
          VERSION_NAME="${{ inputs.version_name }}"
          CHANNEL="${{ inputs.channel }}"
          VERSION_CODE="$((GITHUB_RUN_NUMBER + LAGCHECK_BUILD_OFFSET))"

          bash shared/scripts/android-release.sh "$VERSION_NAME" "$VERSION_CODE" "$CHANNEL" \
            --artifact aab \
            --ads-enabled "$ADS_ENABLED"

          FLAVOR="validation"
          if [ "$CHANNEL" = "production" ]; then
            FLAVOR="production"
          fi
          BUILD_CONFIG="apps/android/app/build/generated/source/buildConfig/${FLAVOR}/release/com/lagcheck/android/BuildConfig.java"
          grep -Fq "public static final boolean ADS_ENABLED = ${ADS_ENABLED};" "$BUILD_CONFIG" || {
            echo "Erro: BuildConfig.ADS_ENABLED não corresponde ao esperado (${ADS_ENABLED})." >&2
            exit 1
          }

          OUT_DIR="shared/distribution/release/android/v${VERSION_NAME}-b${VERSION_CODE}-${CHANNEL}"
          AAB_PATH="${OUT_DIR}/lagcheck-android-${CHANNEL}-v${VERSION_NAME}-b${VERSION_CODE}.aab"
          MAPPING_PATH="${OUT_DIR}/mapping.txt"

          echo "version_code=${VERSION_CODE}" >> "$GITHUB_OUTPUT"
          echo "out_dir=${OUT_DIR}" >> "$GITHUB_OUTPUT"
          echo "aab_path=${AAB_PATH}" >> "$GITHUB_OUTPUT"
          echo "mapping_path=${MAPPING_PATH}" >> "$GITHUB_OUTPUT"

      - name: Generate commercial release notes diff (pt-BR, en-US, es-ES)
        env:
          GH_TOKEN: ${{ github.token }}
          ADS_ENABLED: ${{ steps.policy.outputs.ads_enabled }}
          CUSTOM_NOTES: ${{ inputs.release_notes }}
          VERSION_NAME: ${{ inputs.version_name }}
          VERSION_CODE: ${{ steps.build.outputs.version_code }}
          TRACK: ${{ inputs.track }}
        run: |
          mkdir -p whatsnew
          BASE_REF=""
          HEAD_SHA="$(git rev-parse HEAD)"
          CANDIDATE_SHA="$(gh run list --workflow=android-play-alpha.yml --status=success --limit=1 --json headSha --jq '.[0].headSha' 2>/dev/null || true)"
          if [ -n "$CANDIDATE_SHA" ] && [ "$CANDIDATE_SHA" != "$HEAD_SHA" ] && git cat-file -e "${CANDIDATE_SHA}^{commit}" 2>/dev/null; then
            BASE_REF="$CANDIDATE_SHA"
          fi

          python3 shared/scripts/generate_release_notes.py \
            --platform android \
            --channel "play-${TRACK}" \
            --version "$VERSION_NAME" \
            --build "$VERSION_CODE" \
            --base-ref "$BASE_REF" \
            --custom-notes "$CUSTOM_NOTES" \
            --ads-enabled "$ADS_ENABLED" \
            --out-whatsnew-dir whatsnew \
            --out-github-md "${{ steps.build.outputs.out_dir }}/release-diff.md"

          {
            echo "### Política de anúncios deste build"
            echo "- Track: \`${TRACK}\` | \`ADS_ENABLED=${ADS_ENABLED}\`"
            echo ""
            cat "${{ steps.build.outputs.out_dir }}/release-diff.md"
            echo ""
            for f in whatsnew/whatsnew-*; do
              echo "#### $(basename "$f")"
              echo '```text'
              cat "$f"
              echo '```'
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload AAB, mapping and commercial notes to GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: lagcheck-android-${{ inputs.channel }}-v${{ inputs.version_name }}-b${{ steps.build.outputs.version_code }}
          path: |
            ${{ steps.build.outputs.out_dir }}/*.aab
            ${{ steps.build.outputs.out_dir }}/mapping.txt
            ${{ steps.build.outputs.out_dir }}/SHA256SUMS.txt
            ${{ steps.build.outputs.out_dir }}/release-diff.md
            whatsnew/whatsnew-*
          retention-days: 30

      - name: Publish to Google Play Console (${{ inputs.track }})
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_STORE_SERVICE_ACCOUNT_JSON }}
          packageName: com.lagcheck.app
          releaseFiles: ${{ steps.build.outputs.aab_path }}
          mappingFile: ${{ steps.build.outputs.mapping_path }}
          track: ${{ inputs.track }}
          status: ${{ inputs.release_status }}
          releaseName: v${{ inputs.version_name }} (${{ steps.build.outputs.version_code }})
          whatsNewDirectory: whatsnew

      - name: Clean up signing key material
        if: always()
        run: rm -rf shared/distribution/release/keys
