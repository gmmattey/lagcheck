name: Android Play Console Beta (Alpha)

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: "Versão do produto (X.Y, ex.: 1.2)"
        required: true
        default: "1.2"
        type: string
      track:
        description: "Track do Google Play Console"
        required: true
        default: "alpha"
        type: choice
        options:
          - alpha
          - internal
          - beta
      channel:
        description: "Ambiente GA4 embutido no AAB (testing para validação, production para loja)"
        required: true
        default: "testing"
        type: choice
        options:
          - testing
          - production
      release_status:
        description: "Status do release no Play Console"
        required: true
        default: "completed"
        type: choice
        options:
          - completed
          - draft

permissions:
  contents: read

concurrency:
  group: android-play-release
  cancel-in-progress: false

jobs:
  publish-alpha:
    name: Build, Test & Publish (${{ inputs.track }})
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Run Android unit tests
        working-directory: apps/android
        run: |
          ./gradlew :core:domain:test :core:catalog:test :core:network:test :core:session:test :app:testValidationDebugUnitTest --no-daemon

      - name: Configure upload signing key and build properties
        env:
          ANDROID_UPLOAD_KEYSTORE_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
          ANDROID_UPLOAD_STORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_STORE_PASSWORD }}
          ANDROID_UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          ANDROID_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
          ADMOB_APP_ID: ${{ secrets.ADMOB_APP_ID }}
          ADMOB_NATIVE_HOME_UNIT_ID: ${{ secrets.ADMOB_NATIVE_HOME_UNIT_ID }}
          ADMOB_NATIVE_HISTORY_UNIT_ID: ${{ secrets.ADMOB_NATIVE_HISTORY_UNIT_ID }}
          ADMOB_NATIVE_GAMES_UNIT_ID: ${{ secrets.ADMOB_NATIVE_GAMES_UNIT_ID }}
          ADMOB_NATIVE_RESULT_UNIT_ID: ${{ secrets.ADMOB_NATIVE_RESULT_UNIT_ID }}
        run: |
          if [ -z "$ANDROID_UPLOAD_KEYSTORE_BASE64" ] || [ -z "$ANDROID_UPLOAD_STORE_PASSWORD" ] || [ -z "$ANDROID_UPLOAD_KEY_ALIAS" ] || [ -z "$ANDROID_UPLOAD_KEY_PASSWORD" ]; then
            echo "Erro: configure os secrets ANDROID_UPLOAD_KEYSTORE_BASE64, ANDROID_UPLOAD_STORE_PASSWORD, ANDROID_UPLOAD_KEY_ALIAS e ANDROID_UPLOAD_KEY_PASSWORD." >&2
            exit 1
          fi

          mkdir -p shared/distribution/release/keys
          printf '%s' "$ANDROID_UPLOAD_KEYSTORE_BASE64" | base64 --decode > shared/distribution/release/keys/lagcheck-upload.jks
          cat > shared/distribution/release/keys/lagcheck-upload.properties <<EOF
          storeFile=lagcheck-upload.jks
          storePassword=$ANDROID_UPLOAD_STORE_PASSWORD
          keyAlias=$ANDROID_UPLOAD_KEY_ALIAS
          keyPassword=$ANDROID_UPLOAD_KEY_PASSWORD
          EOF

          mkdir -p "$HOME/.gradle"
          {
            [ -n "$ADMOB_APP_ID" ] && echo "lagcheck.admobAppId=$ADMOB_APP_ID"
            [ -n "$ADMOB_NATIVE_HOME_UNIT_ID" ] && echo "lagcheck.admobNativeHomeUnitId=$ADMOB_NATIVE_HOME_UNIT_ID"
            [ -n "$ADMOB_NATIVE_HISTORY_UNIT_ID" ] && echo "lagcheck.admobNativeHistoryUnitId=$ADMOB_NATIVE_HISTORY_UNIT_ID"
            [ -n "$ADMOB_NATIVE_GAMES_UNIT_ID" ] && echo "lagcheck.admobNativeGamesUnitId=$ADMOB_NATIVE_GAMES_UNIT_ID"
            [ -n "$ADMOB_NATIVE_RESULT_UNIT_ID" ] && echo "lagcheck.admobNativeResultUnitId=$ADMOB_NATIVE_RESULT_UNIT_ID"
          } >> "$HOME/.gradle/gradle.properties" || true

      - name: Build and verify signed AAB
        id: build
        env:
          LAGCHECK_BUILD_OFFSET: ${{ vars.LAGCHECK_BUILD_OFFSET || '8' }}
        run: |
          VERSION_NAME="${{ inputs.version_name }}"
          CHANNEL="${{ inputs.channel }}"
          VERSION_CODE="$((GITHUB_RUN_NUMBER + LAGCHECK_BUILD_OFFSET))"

          bash shared/scripts/android-release.sh "$VERSION_NAME" "" "$CHANNEL"

          OUT_DIR="shared/distribution/release/android/v${VERSION_NAME}-b${VERSION_CODE}-${CHANNEL}"
          AAB_PATH="${OUT_DIR}/lagcheck-android-${CHANNEL}-v${VERSION_NAME}-b${VERSION_CODE}.aab"
          MAPPING_PATH="${OUT_DIR}/mapping.txt"

          echo "version_code=${VERSION_CODE}" >> "$GITHUB_OUTPUT"
          echo "out_dir=${OUT_DIR}" >> "$GITHUB_OUTPUT"
          echo "aab_path=${AAB_PATH}" >> "$GITHUB_OUTPUT"
          echo "mapping_path=${MAPPING_PATH}" >> "$GITHUB_OUTPUT"

      - name: Upload AAB and mapping to GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: lagcheck-android-${{ inputs.channel }}-v${{ inputs.version_name }}-b${{ steps.build.outputs.version_code }}
          path: |
            ${{ steps.build.outputs.out_dir }}/*.aab
            ${{ steps.build.outputs.out_dir }}/mapping.txt
            ${{ steps.build.outputs.out_dir }}/SHA256SUMS.txt
          retention-days: 30

      - name: Publish to Google Play Console (${{ inputs.track }})
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_STORE_SERVICE_ACCOUNT_JSON }}
          packageName: com.lagcheck.app
          releaseFiles: ${{ steps.build.outputs.aab_path }}
          mappingFile: ${{ steps.build.outputs.mapping_path }}
          track: ${{ inputs.track }}
          status: ${{ inputs.release_status }}
          releaseName: v${{ inputs.version_name }} (${{ steps.build.outputs.version_code }})

      - name: Clean up signing key material
        if: always()
        run: rm -rf shared/distribution/release/keys
