<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="../../colors_and_type.css"><title>LagCheck · Anatomia</title><style>body{max-width:800px;margin:auto;padding:44px 22px;background:var(--lc-stage);color:var(--lc-fg);font:15px var(--lc-font-body)}h1,h2{font-family:var(--lc-font-display);letter-spacing:-.05em}h1{font-size:48px}section{padding:20px;margin:16px 0;border:1px solid var(--lc-border);border-radius:var(--lc-radius-md);background:var(--lc-bg)}button{font:inherit;cursor:pointer}.primary{width:100%;min-height:58px;border:0;border-radius:var(--lc-radius-lg);background:var(--lc-accent);color:var(--lc-on-accent);font-weight:800}.danger{min-height:48px;padding:0 18px;border:0;border-radius:13px;background:var(--lc-attention);color:var(--lc-on-accent);font-weight:800}.secondary{min-height:44px;padding:0 15px;border:1px solid var(--lc-border);border-radius:12px;background:transparent;color:var(--lc-fg);font-weight:700}.sheet{padding:16px;margin-top:12px;border-top:1px solid var(--lc-border);border-radius:26px 26px 0 0;background:var(--lc-surface)}.handle{width:35px;height:4px;margin:0 auto 18px;border-radius:999px;background:var(--lc-border)}.state{padding:14px;border:1px solid var(--lc-border);border-radius:13px}.state strong{display:block;font:800 24px var(--lc-font-display);letter-spacing:-.05em}.good{color:var(--lc-good)}.inconclusive{color:var(--lc-muted)}button:focus-visible{outline:3px solid var(--lc-fg);outline-offset:3px}</style></head><body data-od-id="anatomia-componentes"><h1>Anatomia</h1><section><h2>Ações</h2><button class="primary" type="button">Checar agora</button><p><button class="secondary" type="button">Trocar jogo</button> <button class="danger" type="button">Apagar</button></p></section><section><h2>Bottom sheet</h2><div class="sheet"><div class="handle"></div><strong>Apagar todo o histórico?</strong><p style="color:var(--lc-muted)">Esta ação não pode ser desfeita.</p><button class="secondary" type="button">Cancelar</button> <button class="danger" type="button">Apagar</button></div></section><section><h2>Estados de resultado</h2><div class="state"><strong class="good">PRONTO PARA RANKED</strong><p>Resultados favoráveis ainda carregam contexto observável.</p></div><p></p><div class="state"><strong class="inconclusive">— INCONCLUSIVO</strong><p>Não foi possível avaliar com segurança desta vez.</p></div></section></body></html>
