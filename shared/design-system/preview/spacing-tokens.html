<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="../colors_and_type.css"><title>LagCheck · Espaçamento</title><style>body{margin:0;padding:44px 22px;background:var(--lc-stage);color:var(--lc-fg);font:15px var(--lc-font-body)}main{max-width:820px;margin:auto}h1{font:800 50px var(--lc-font-display);letter-spacing:-.06em}.stack{display:grid;gap:15px;padding:22px;border:1px solid var(--lc-border);border-radius:17px;background:var(--lc-bg)}.token{display:grid;grid-template-columns:80px 1fr;gap:14px;align-items:center;color:var(--lc-muted);font:12px var(--lc-font-mono)}.bar{height:12px;border-radius:99px;background:var(--lc-accent)}.touch{display:grid;place-items:center;width:44px;height:44px;border:1px solid var(--lc-border);border-radius:12px;background:var(--lc-surface);font:11px var(--lc-font-mono)}</style></head><body><main data-od-id="preview-espacamento"><h1>Ritmo que deixa a decisão respirar.</h1><div class="stack"><div class="token"><span>4 px</span><i class="bar" style="width:4px"></i></div><div class="token"><span>8 px</span><i class="bar" style="width:8px"></i></div><div class="token"><span>12 px</span><i class="bar" style="width:12px"></i></div><div class="token"><span>16 px</span><i class="bar" style="width:16px"></i></div><div class="token"><span>24 px</span><i class="bar" style="width:24px"></i></div><div class="token"><span>32 px</span><i class="bar" style="width:32px"></i></div></div><p style="display:flex;gap:12px;align-items:center;color:var(--lc-muted)"><span class="touch">44 px</span> Alvo mínimo para toque observado nos controles do produto.</p></main></body></html>
