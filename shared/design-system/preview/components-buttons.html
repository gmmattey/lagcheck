<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="../colors_and_type.css"><title>LagCheck · Botões</title><style>body{margin:0;padding:44px 22px;background:var(--lc-stage);color:var(--lc-fg);font:15px var(--lc-font-body)}main{max-width:570px;margin:auto}h1{font:800 48px var(--lc-font-display);letter-spacing:-.06em}.panel{padding:22px;border:1px solid var(--lc-border);border-radius:17px;background:var(--lc-bg)}button{font:inherit;font-weight:800;cursor:pointer}.primary{width:100%;min-height:58px;border:0;border-radius:17px;background:var(--lc-accent);color:var(--lc-on-accent);box-shadow:var(--lc-shadow-action)}.primary:hover{background:var(--lc-accent-hover)}.primary:active{transform:scale(.98)}.secondary,.danger{min-height:46px;padding:0 16px;margin-top:12px;border-radius:12px}.secondary{border:1px solid var(--lc-border);background:transparent;color:var(--lc-fg)}.secondary:hover{background:var(--lc-surface)}.danger{border:0;background:var(--lc-attention);color:var(--lc-on-accent)}button:focus-visible{outline:3px solid var(--lc-fg);outline-offset:3px}</style></head><body><main data-od-id="preview-botoes"><h1>Uma ação forte. O resto, contexto.</h1><section class="panel"><button class="primary" type="button">Checar agora</button><button class="secondary" type="button">Trocar jogo</button><button class="danger" type="button">Apagar histórico</button></section></main></body></html>
