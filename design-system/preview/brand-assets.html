<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LagCheck · Marca oficial</title>
  <link rel="stylesheet" href="../colors_and_type.css">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 32px; background: var(--lc-bg); color: var(--lc-fg); font-family: var(--lc-font-body); }
    main { width: min(860px, 100%); }
    .eyebrow { margin: 0 0 10px; color: var(--lc-muted); font: 700 11px/1 var(--lc-font-mono); letter-spacing: .12em; text-transform: uppercase; }
    h1 { margin: 0 0 28px; font: 700 clamp(28px, 5vw, 46px)/1 var(--lc-font-display); letter-spacing: -.04em; }
    .stage { display: grid; gap: 24px; padding: clamp(24px, 6vw, 56px); border: 1px solid var(--lc-border); border-radius: 26px; background: var(--lc-surface); }
    .wordmark { width: min(620px, 100%); height: auto; display: block; }
    .rule { margin: 0; max-width: 56ch; color: var(--lc-muted); font-size: 15px; line-height: 1.55; }
    .assets { display: flex; align-items: center; gap: 18px; padding-top: 22px; border-top: 1px solid var(--lc-border); }
    .icon { width: 70px; height: 70px; flex: 0 0 auto; }
    .meta { display: grid; gap: 5px; }
    .meta strong { font: 700 14px/1.25 var(--lc-font-body); }
    .meta span { color: var(--lc-muted); font: 12px/1.45 var(--lc-font-mono); }
    @media (max-width: 520px) { body { padding: 18px; } .assets { align-items: flex-start; } .icon { width: 56px; height: 56px; } }
  </style>
</head>
<body>
  <main data-od-id="brand-assets-page">
    <p class="eyebrow">Ativo de marca · superfícies escuras</p>
    <h1 data-od-id="brand-assets-title">Marca oficial, com a hierarquia certa.</h1>
    <section class="stage" data-od-id="brand-assets-stage" aria-label="Aplicação da marca LagCheck">
      <img class="wordmark" src="../assets/brand/wordmark-primary.svg" alt="LagCheck">
      <p class="rule">Símbolo e <strong>Check</strong> em Roxo Gamer. <strong>Lag</strong> segue branco.</p>
      <div class="assets" data-od-id="app-icon-asset">
        <img class="icon" src="../assets/brand/app-icon-source.svg" alt="Ícone oficial do LagCheck">
        <div class="meta">
          <strong>Ícone oficial</strong>
          <span>Geometria preservada · gradiente em Roxo Gamer</span>
        </div>
      </div>
    </section>
  </main>
</body>
</html>
