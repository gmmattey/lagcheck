<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="../colors_and_type.css"><title>LagCheck · Componentes</title><style>body{margin:0;background:var(--lc-stage);color:var(--lc-fg);font:15px/1.4 var(--lc-font-body)}main{max-width:780px;margin:auto;padding:44px 22px}h1,h2{font-family:var(--lc-font-display);letter-spacing:-.05em}h1{font-size:44px}.panel{padding:20px;margin:14px 0;border:1px solid var(--lc-border);border-radius:var(--lc-radius-md);background:var(--lc-bg)}button{font:inherit;cursor:pointer}.primary{width:100%;min-height:58px;border:0;border-radius:var(--lc-radius-lg);background:var(--lc-accent);color:var(--lc-on-accent);font-weight:800;box-shadow:var(--lc-shadow-action)}.primary:hover{background:var(--lc-accent-hover)}.secondary{min-height:44px;padding:0 16px;border:1px solid var(--lc-border);border-radius:12px;background:transparent;color:var(--lc-fg);font-weight:700}.secondary:hover{background:var(--lc-surface)}button:focus-visible{outline:3px solid var(--lc-fg);outline-offset:3px}.pill{display:inline-flex;gap:7px;align-items:center;min-height:27px;padding:0 9px;border:1px solid var(--lc-border);border-radius:999px;color:var(--lc-muted);font:11px var(--lc-font-mono)}.dot{width:6px;height:6px;border-radius:50%;background:var(--lc-good);box-shadow:0 0 0 3px oklch(.76 .15 150/.11)}.row{display:flex;align-items:center;gap:12px;min-height:72px;border-top:1px solid var(--lc-border)}.cover{width:42px;height:52px;object-fit:cover;border:1px solid var(--lc-border);border-radius:8px}.meta{flex:1}.meta strong,.meta small{display:block}.meta small{margin-top:4px;color:var(--lc-muted);font:11px var(--lc-font-mono)}.verdict{color:var(--lc-good);font:900 36px/.95 var(--lc-font-display);letter-spacing:-.07em}.warn{color:var(--lc-attention)}</style></head><body><main data-od-id="preview-componentes"><h1>Componentes com intenção</h1><section class="panel"><h2>Decisão e telemetria</h2><span class="pill"><i class="dot"></i> Wi-Fi · 18 ms</span><p><button class="primary" type="button">Checar agora</button></p><button class="secondary" type="button">Trocar jogo</button></section><section class="panel"><h2>Lista de jogo</h2><div class="row"><img class="cover" src="../assets/fortnite.jpg" alt="Capa neutra de Fortnite"><span class="meta"><strong>Fortnite</strong><small>PlayStation · Wi-Fi</small></span><span aria-hidden="true">›</span></div><div class="row"><img class="cover" src="../assets/valorant.jpg" alt="Capa neutra de Valorant"><span class="meta"><strong>Valorant</strong><small>PC · Ethernet</small></span><span aria-hidden="true">›</span></div></section><section class="panel"><h2>Veredito</h2><p class="verdict">PRONTO PARA RANKED</p><p class="warn verdict">CONDIÇÕES INSTÁVEIS</p><p class="type-mono">Quando não há dados, escrever “Inconclusivo” e explicar o motivo.</p></section></main></body></html>
