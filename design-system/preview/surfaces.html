<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="../colors_and_type.css"><title>LagCheck · Superfícies</title><style>body{margin:0;background:var(--lc-stage);color:var(--lc-fg);font:15px var(--lc-font-body)}main{max-width:1100px;margin:auto;padding:42px 22px}h1{font:800 46px var(--lc-font-display);letter-spacing:-.06em}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:16px}.phone{min-height:500px;padding:24px;border:1px solid var(--lc-border);border-radius:28px;background:var(--lc-bg)}.word{width:115px}.pill{display:inline-flex;gap:7px;align-items:center;margin:30px 0 12px;padding:0 9px;min-height:27px;border:1px solid var(--lc-border);border-radius:999px;color:var(--lc-muted);font:11px var(--lc-font-mono)}.dot{width:6px;height:6px;border-radius:50%;background:var(--lc-good)}.art{display:block;width:calc(100% + 48px);height:152px;margin:0 -24px;object-fit:cover;mask-image:linear-gradient(to bottom,#000 60%,transparent)}h2{margin:12px 0 4px;font:800 35px/.95 var(--lc-font-display);letter-spacing:-.06em}.muted{color:var(--lc-muted)}.cta{width:100%;min-height:58px;margin-top:30px;border:0;border-radius:17px;background:var(--lc-accent);color:var(--lc-on-accent);font-weight:800}.verdict{margin-top:80px;color:var(--lc-good);font:900 42px/.9 var(--lc-font-display);letter-spacing:-.07em}.metric{padding:12px;margin-top:18px;border:1px solid var(--lc-border);border-radius:13px;background:var(--lc-surface)}.metric small{display:block;color:var(--lc-muted);font:10px var(--lc-font-mono)}.metric strong{display:block;margin-top:5px;font:600 15px var(--lc-font-mono)}</style></head><body><main data-od-id="preview-superficies"><h1>Superfícies aplicadas</h1><div class="grid"><article class="phone"><img class="word" src="../assets/lagcheck-wordmark-light.svg" alt="LagCheck"><span class="pill"><i class="dot"></i> Wi-Fi · 18 ms</span><img class="art"
