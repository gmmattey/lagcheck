<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>lagcheck para Windows — protótipo premium</title>
<style>
/* Tokens: android/core/designsystem/.../theme/Color.kt (fonte de verdade do Android). Sem cor nova. */
@font-face{font-family:'Google Sans Flex';font-weight:400;src:url(assets/google_sans_flex_regular.ttf)}
@font-face{font-family:'Google Sans Flex';font-weight:500;src:url(assets/google_sans_flex_medium.ttf)}
@font-face{font-family:'Google Sans Flex';font-weight:600;src:url(assets/google_sans_flex_semibold.ttf)}
@font-face{font-family:'Google Sans Flex';font-weight:700 800;src:url(assets/google_sans_flex_bold.ttf)}
:root{
 --bg:#0B0D10;--surface:#15181E;--panel:#1E232B;--border:#262D38;--hair:rgba(255,255,255,.08);--strong:rgba(255,255,255,.16);--hover:#384352;
 --accent:#7C3AED;--accent-subtle:rgba(124,58,237,.15);--accent-text:#A78BFA; /* accent-text = tint legível do Roxo Gamer em texto pequeno */
 --coral:#FF5A36;--caution:#F59E0B;--good:#22C55E;--inconc:#8A93A0;
 --fg:#F4F5F7;--muted:#8A93A0;--faint:#606873;
 --display:'Google Sans Flex','Segoe UI Variable Display','Segoe UI',system-ui,sans-serif;--body:'Google Sans Flex','Segoe UI Variable Text','Segoe UI',system-ui,sans-serif;--mono:'Cascadia Mono',Consolas,ui-monospace,monospace;
 --ease:cubic-bezier(.2,0,0,1);--r8:8px;--r13:13px;--r17:17px}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font:400 14px/20px var(--body);min-width:980px;overflow:hidden;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
:focus-visible{outline:3px solid var(--accent-text);outline-offset:3px;border-radius:var(--r8)}
.mono{font-family:var(--mono)}
.app{height:100vh;display:grid;grid-template-rows:40px 1fr;grid-template-columns:208px 1fr}

/* barra de título */
.titlebar{grid-column:1/-1;display:flex;align-items:center;padding-left:16px;background:var(--bg)}
.titlebar img{height:18px;display:block;position:absolute;left:16px}
.tb-actions{display:flex;margin-left:0;position:absolute;right:0;top:0}
.tb-btn{width:46px;height:40px;border:0;background:none;display:grid;place-items:center;color:var(--muted);cursor:pointer}
.tb-btn:hover{background:var(--hair);color:var(--fg)}.tb-btn.close:hover{background:#C42B1C;color:#fff}

/* navegação */
.nav{padding:12px 12px 16px;display:flex;flex-direction:column;gap:2px;position:relative}
.ind{position:absolute;left:0;top:0;width:3px;height:20px;border-radius:2px;background:var(--accent);box-shadow:0 0 14px var(--accent);transition:transform .4s var(--ease)}
.nav-item{display:flex;align-items:center;gap:12px;height:44px;padding:0 12px;border:0;background:none;border-radius:var(--r8);color:var(--muted);font:600 14px var(--body);cursor:pointer;text-align:left;transition:background .2s,color .2s,transform .12s}
.nav-item:hover{background:var(--hair);color:var(--fg)}.nav-item:active{transform:scale(.98)}
.nav-item[aria-current=page]{color:var(--fg);background:var(--surface)}
.nav-item[aria-current=page] svg{color:var(--accent-text)}
.nav .foot{margin-top:auto;display:flex;align-items:center;gap:8px;padding:10px 12px;font:500 11px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.dot{width:7px;height:7px;border-radius:50%;background:var(--good);box-shadow:0 0 0 0 rgba(34,197,94,.5);animation:ping 2.4s var(--ease) infinite}
@keyframes ping{70%,100%{box-shadow:0 0 0 8px rgba(34,197,94,0)}}

/* palco: escuro liso, vinheta fina e grade de pontos */
.stage{position:relative;background:radial-gradient(900px 420px at 70% -10%,rgba(124,58,237,.10),transparent 70%),var(--surface);border-radius:17px 0 0 0;overflow:auto;box-shadow:inset 1px 1px 0 var(--hair)}
.stage.out>.page{opacity:0;transform:translateX(calc(var(--dx,24px)*-.4));transition:opacity .14s,transform .14s}
.page{max-width:1120px;margin:0 auto;padding:32px 32px 56px;display:grid;grid-template-columns:minmax(0,1fr);gap:28px;animation:pageIn .5s var(--ease) both}
.page>*{animation:rise .55s var(--ease) both;animation-delay:calc(var(--i,0)*70ms)}
@keyframes pageIn{from{opacity:0;transform:translateX(var(--dx,24px))}}@keyframes rise{from{opacity:0;transform:translateY(14px)}}
.head{display:flex;align-items:flex-end;gap:16px}
.head h1{font:800 28px/32px var(--display);margin:0;letter-spacing:-.02em}
.head p{margin:2px 0 0;color:var(--muted)}
.head .spacer{margin-left:auto;display:flex;gap:8px;align-items:center}
.eyebrow{font:500 11px/16px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:0 0 12px}

/* botões */
.btn{position:relative;overflow:hidden;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 20px;border-radius:var(--r13);border:1px solid var(--strong);background:transparent;font:700 14px var(--body);cursor:pointer;transition:transform .12s,border-color .2s,background .2s,box-shadow .25s}
.btn:hover{border-color:var(--hover);background:var(--hair)}.btn:active{transform:scale(.98)}
.btn.primary{border:0;min-height:56px;padding:0 32px;border-radius:var(--r17);background:var(--accent);color:#fff;font:800 16px var(--display);box-shadow:0 12px 28px rgba(124,58,237,.34)}
.btn.primary::after{content:"";position:absolute;inset:0;background:linear-gradient(105deg,transparent 38%,rgba(255,255,255,.28) 50%,transparent 62%);transform:translateX(-120%)}
.btn.primary:hover{background:#8b4cf2;box-shadow:0 16px 36px rgba(124,58,237,.46)}.btn.primary:hover::after{transform:translateX(120%);transition:transform .8s var(--ease)}
.btn.text{border:0;color:var(--accent-text)}.btn.text:hover{background:var(--accent-subtle)}
.btn:disabled{opacity:.5;pointer-events:none}

/* pílulas de telemetria */
.pill{display:inline-flex;align-items:center;gap:8px;height:28px;padding:0 0 0 12px;font:700 12px var(--mono);letter-spacing:.08em;text-transform:uppercase;border-left:3px solid currentColor;border-radius:0;background:linear-gradient(90deg,color-mix(in srgb,currentColor 14%,transparent),transparent 85%);padding-right:28px}
.pill.good{color:var(--good)}.pill.caution{color:var(--caution)}.pill.bad{color:var(--coral)}.pill.inconc{color:var(--inconc)}.pill.accent{color:var(--accent-text)}

/* seções separadas por linha, não por cards */
.sec{border-top:1px solid var(--hair);padding-top:24px}
.panel{background:var(--bg);border:1px solid var(--hair);border-radius:var(--r13);position:relative}
.panel::before{content:"";position:absolute;left:12px;right:12px;top:-1px;height:1px;background:linear-gradient(90deg,transparent,rgba(167,139,250,.55),transparent);opacity:.7}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:32px}

/* início */
.hero{display:grid;grid-template-columns:1fr 340px;gap:48px;align-items:center;padding:8px 0 4px}
.hero h2{font:800 52px/56px var(--display);letter-spacing:-.03em;margin:18px 0 12px;max-width:14ch}
.hero p.lead{font-size:16px;line-height:24px;color:var(--muted);margin:0 0 28px;max-width:46ch}
/* tiles de jogo: leitura Razer Synapse (tile escuro + círculo de ícone + rótulo em caixa alta), na paleta do Android */
.games{display:grid;grid-template-columns:repeat(3,132px);gap:10px;margin:0 0 28px}
.game{position:relative;display:flex;flex-direction:column;align-items:center;gap:10px;padding:16px 8px 12px;border-radius:var(--r13);border:1px solid var(--hair);background:var(--bg);cursor:pointer;font:700 11px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);transition:border-color .25s,background .25s,transform .15s,color .25s,box-shadow .3s}
.game:hover{border-color:var(--hover);color:var(--fg);transform:translateY(-2px)}.game:active{transform:scale(.98)}
.game[aria-pressed=true]{border-color:var(--accent);background:var(--accent-subtle);color:var(--fg);box-shadow:0 0 0 1px var(--accent),0 10px 26px -10px rgba(124,58,237,.6)}
.game i{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;background:var(--panel);font:800 18px var(--display);color:var(--accent-text);font-style:normal;transition:background .25s,color .25s}
.game[aria-pressed=true] i{background:var(--accent);color:#fff}
.ovl{margin:0 auto;display:flex;align-items:center;gap:14px;height:28px;padding:0 14px;border-radius:6px;background:var(--surface);border:1px solid var(--hair);font:500 11px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.ovl b{color:var(--fg);font-weight:600}.ovl i{width:6px;height:6px;border-radius:50%;background:var(--good)}
.tele{display:grid;gap:0}
.trow{display:grid;grid-template-columns:1fr auto;align-items:end;padding:16px 0;border-top:1px solid var(--hair)}
.trow:first-child{border-top:0}
.trow .l{font:500 11px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.trow .v{font:600 40px/1 var(--mono);letter-spacing:-.04em;font-variant-numeric:tabular-nums}.trow .v small{font:500 13px var(--mono);color:var(--muted);margin-left:4px;letter-spacing:0}
.trow svg.sp{grid-column:1/-1;width:100%;height:28px;margin-top:10px;overflow:visible}
.sp path.l{fill:none;stroke:var(--accent-text);stroke-width:2;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1.3s var(--ease) .4s forwards}
.sp path.a{fill:var(--accent);opacity:0;animation:fa 1s ease 1.1s forwards}
@keyframes draw{to{stroke-dashoffset:0}}@keyframes fa{to{opacity:.14}}
.line{display:grid;grid-template-columns:130px 1fr 240px 90px;align-items:center;gap:16px;min-height:52px;border-top:1px solid var(--hair);transition:background .2s,padding .2s;border-radius:8px}
.line:first-child{border-top:0}.line:hover{background:rgba(255,255,255,.03);padding:0 8px}
.line .when{font:500 12px var(--mono);color:var(--muted)}.line .name{font-weight:700}.line .name small{display:block;font-weight:400;color:var(--muted)}
.line .ms{text-align:right;font:600 14px var(--mono);font-variant-numeric:tabular-nums}

/* check: mapa */
.map{overflow:hidden;background:radial-gradient(70% 90% at 50% 40%,#12151b,var(--bg))}
.map canvas{display:block;width:100%}
.mapphase{position:absolute;left:20px;top:18px;display:flex;align-items:center;gap:12px;max-width:62%}
.mapphase .pill{flex:none;white-space:nowrap}
.mapphase .t{font:700 15px var(--display);line-height:18px}.mapphase small{display:block;font:400 12px var(--mono);color:var(--muted);margin-top:2px}
.mapms{position:absolute;right:22px;top:14px;text-align:right;pointer-events:none}
.mapms span{font:600 64px/1 var(--mono);letter-spacing:-.05em;font-variant-numeric:tabular-nums}.mapms small{font:500 14px var(--mono);color:var(--muted);margin-left:4px}
.mapms em{display:block;font:500 10px var(--mono);font-style:normal;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-top:4px}
.mapfoot{position:absolute;left:20px;bottom:14px;font:400 11px var(--mono);color:var(--faint);max-width:44%}
.protoctl{position:absolute;right:14px;bottom:12px;display:grid;gap:6px;justify-items:end;padding:8px 10px;border-radius:var(--r13);background:rgba(11,13,16,.85);border:1px solid var(--hair)}
.protoctl div{display:flex;align-items:center;gap:4px}.protoctl label{font:500 10px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--faint);margin-right:6px}
.chip{height:26px;padding:0 10px;border-radius:6px;border:1px solid var(--hair);background:none;font:600 11px var(--mono);color:var(--muted);cursor:pointer;transition:all .2s}
.chip:hover{border-color:var(--hover);color:var(--fg)}.chip[aria-pressed=true]{border-color:var(--accent);background:var(--accent-subtle);color:var(--fg)}
.srv{display:grid;grid-template-columns:1fr 110px 56px;align-items:center;gap:14px;min-height:56px;border-top:1px solid var(--hair);transition:opacity .4s,background .3s}
.srv:first-child{border-top:0}
.srv b{font-weight:700;display:flex;align-items:center;gap:8px}.srv small{display:block;font:400 11px var(--mono);color:var(--muted)}
.srv .bar{height:4px;border-radius:2px;background:var(--hair);overflow:hidden}.srv .bar i{display:block;height:100%;width:0;border-radius:2px;background:var(--muted);transition:width .9s var(--ease),background .4s}
.srv .ms{text-align:right;font:600 15px var(--mono);font-variant-numeric:tabular-nums}
.srv.probing .bar i{width:20%!important;background:var(--accent-text);animation:scan 1s ease-in-out infinite alternate}
@keyframes scan{to{margin-left:80%}}
.srv.best .bar i{background:var(--good);box-shadow:0 0 10px var(--good)}.srv.best .ms{color:var(--good)}
.srv.dim{opacity:.45}
.tag{font:700 10px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--good);border-left:2px solid currentColor;padding:0 0 0 7px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);margin-bottom:20px;border-top:1px solid var(--hair);border-bottom:1px solid var(--hair)}
.stat{padding:16px 0 16px 16px;border-left:1px solid var(--hair)}.stat:first-child{border-left:0;padding-left:0}
.stat .l{font:500 10px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.stat .n{display:block;font:600 34px/1.2 var(--mono);letter-spacing:-.04em;font-variant-numeric:tabular-nums}.stat .n small{font:500 12px var(--mono);color:var(--muted);margin-left:3px;letter-spacing:0}
.probes{display:flex;align-items:flex-end;gap:8px;height:96px}
.pr{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:6px;height:100%}
.pr span{width:100%;border-radius:4px 4px 2px 2px;min-height:5px;background:linear-gradient(var(--accent-text),var(--accent));box-shadow:0 0 14px -4px var(--accent);animation:grow .55s var(--ease) both}
.pr.lost span{background:repeating-linear-gradient(135deg,var(--coral) 0 3px,transparent 3px 6px);height:100%!important;opacity:.55;border:1px dashed var(--coral);box-shadow:none}
.pr.ghost span{background:var(--hair);box-shadow:none;height:5px!important;animation:none}
.pr small{font:500 10px var(--mono);color:var(--muted)}
@keyframes grow{from{height:5px!important;opacity:0}}
.fine{font:400 12px var(--mono);color:var(--muted);margin:16px 0 0}

/* resultado */
.res{display:grid;gap:8px}
.res h2{font:800 60px/64px var(--display);letter-spacing:-.035em;margin:14px 0 8px;max-width:16ch}
.res p.lead{font-size:16px;line-height:24px;color:var(--muted);margin:0;max-width:56ch}
.series{width:100%;height:auto;display:block}.series text{font:500 11px var(--mono);fill:var(--muted)}
.series .gl{stroke:var(--hair)}
.route{display:flex;align-items:center;gap:0;padding:8px 0}
.rn{display:flex;flex-direction:column;gap:2px;min-width:150px}.rn b{font-weight:700}.rn small{font:400 11px var(--mono);color:var(--muted)}
.rl{flex:1;height:1px;background:repeating-linear-gradient(90deg,var(--muted) 0 4px,transparent 4px 10px);position:relative;margin:0 16px;min-width:80px}
.rl em{position:absolute;left:50%;top:-22px;transform:translateX(-50%);font:600 13px var(--mono);font-style:normal;color:var(--fg)}
.empty{padding:48px 0;color:var(--muted)}

/* histórico */
.chartwrap{position:relative}
.chart{width:100%;height:auto;display:block}.chart text{font:500 11px var(--mono);fill:var(--muted)}.chart .gl{stroke:var(--hair)}
.chart .cross{stroke:var(--accent-text);stroke-dasharray:3 4;opacity:0;transition:opacity .2s}
.tip{position:absolute;pointer-events:none;padding:8px 12px;border-radius:var(--r8);background:var(--panel);border:1px solid var(--strong);box-shadow:0 10px 28px rgba(0,0,0,.5);font:600 12px var(--mono);white-space:nowrap;opacity:0;transform:translate(-50%,-110%);transition:opacity .15s}.tip.on{opacity:1}
.switch{width:44px;height:24px;border-radius:6px;border:0;background:var(--border);position:relative;cursor:pointer;flex:none;transition:background .25s}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:3px;background:#fff;transition:transform .3s var(--ease)}
.switch[aria-checked=true]{background:var(--accent)}.switch[aria-checked=true]::after{transform:translateX(20px)}
.set{display:flex;align-items:center;gap:16px;min-height:64px;border-top:1px solid var(--hair)}.set:first-of-type{border-top:0}.set div{flex:1}.set b{display:block}.set small{color:var(--muted)}
.toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,24px);opacity:0;background:var(--panel);border:1px solid var(--strong);padding:10px 18px;border-radius:6px;box-shadow:0 12px 30px rgba(0,0,0,.5);font:600 13px var(--body);transition:all .3s var(--ease);pointer-events:none;z-index:60}.toast.show{opacity:1;transform:translate(-50%,0)}
.proto{position:fixed;right:12px;bottom:12px;font:500 10px var(--mono);letter-spacing:.08em;text-transform:uppercase;padding:4px 10px;border-radius:6px;background:var(--panel);color:var(--muted);pointer-events:none;z-index:60}
html.calm *,html.calm *::before,html.calm *::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
@media(max-width:1180px){.app{grid-template-columns:64px 1fr}.nav-item span,.nav .foot span{display:none}.nav-item{justify-content:center;padding:0}.hero{grid-template-columns:1fr}.grid2{grid-template-columns:1fr}.page{padding:24px 20px 48px}}
</style>
</head>
<body>
<div class="app">
  <header class="titlebar"><img src="assets/wordmark-primary.svg" alt="lagcheck">
    <div class="ovl" aria-label="Último check"><i></i>São Paulo <b>27 ms</b> · jitter <b>1,1</b> · perda <b>0%</b></div>
    <div class="tb-actions">
      <button class="tb-btn" aria-label="Minimizar"><svg class="i" viewBox="0 0 24 24"><path d="M5 12h14"/></svg></button>
      <button class="tb-btn" aria-label="Maximizar"><svg class="i" viewBox="0 0 24 24"><rect x="5" y="5" width="14" height="14" rx="2"/></svg></button>
      <button class="tb-btn close" aria-label="Fechar"><svg class="i" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    </div></header>
  <nav class="nav" id="nav" aria-label="Navegação principal"></nav>
  <main class="stage" id="stage" tabindex="-1"></main>
</div>
<div class="toast" id="toast" role="status"></div>
<div class="proto">Protótipo · dados simulados</div>

 const swap=()=>{teardown&&teardown();teardown=null;cur=id;stage.innerHTML=V[id]();stage.scrollTop=0;const n=NAVOF[id]||id;$$('.nav-item').forEach(b=>b.setAttribute('aria-current',b.dataset.go===n?'page':'false'));moveInd();$$('.page>*',stage).forEach((e,i)=>e.style.setProperty('--i',i));after(id,o)};
 cur?(stage.classList.add('out'),setTimeout(()=>{swap();stage.classList.remove('out')},140)):swap()}
function after(id,o){$$('[data-c]',stage).forEach(e=>countUp(e,+e.dataset.c,+(e.dataset.d||0),1100));
 if(id==='check'){teardown=initCheck();if(o.auto)setTimeout(()=>$('#detect')&&$('#detect').click(),450)}
 if(id==='hist')bindChart();
 if(id==='home')$$('.game').forEach(b=>b.onclick=()=>{GAME=b.dataset.game;$$('.game').forEach(x=>x.setAttribute('aria-pressed',x===b))});
 if(id==='cfg')$$('.switch').forEach(s=>s.onclick=()=>{const on=s.getAttribute('aria-checked')!=='true';s.setAttribute('aria-checked',on);if(s.dataset.sw==='calm')document.documentElement.classList.toggle('calm',on)})}
document.addEventListener('click',e=>{const t=e.target.closest('[data-go],[data-toast]');if(!t)return;t.dataset.toast?toast(t.dataset.toast):go(t.dataset.go,{auto:t.dataset.auto})});
window.addEventListener('keydown',e=>{if(e.ctrlKey&&e.key>='1'&&e.key<='4')go(PAGES[e.key-1][0])});window.addEventListener('resize',moveInd);

/* ============ Check: detecção de região + animação de ping ============ */
const USERS={salvador:{n:'Salvador',c:'BR',lat:-12.97,lon:-38.51},miami:{n:'Miami',c:'EUA',lat:25.76,lon:-80.19},lisboa:{n:'Lisboa',c:'PT',lat:38.72,lon:-9.14},osaka:{n:'Osaka',c:'JP',lat:34.69,lon:135.5}};
const SERVERS=[{n:'São Paulo',code:'sa-east-1',lat:-23.55,lon:-46.63},{n:'Virgínia',code:'us-east-1',lat:38.95,lon:-77.45},{n:'Oregon',code:'us-west-2',lat:45.84,lon:-119.7},{n:'Frankfurt',code:'eu-central-1',lat:50.11,lon:8.68},{n:'Tóquio',code:'ap-northeast-1',lat:35.68,lon:139.75}];
const km=(a,b)=>{const R=6371,r=Math.PI/180,dl=(b.lat-a.lat)*r,dn=(b.lon-a.lon)*r,h=Math.sin(dl/2)**2+Math.cos(a.lat*r)*Math.cos(b.lat*r)*Math.sin(dn/2)**2;return 2*R*Math.asin(Math.sqrt(h))};
const baseRtt=(u,s)=>4+km(u,s)/62; // só no protótipo. No app o RTT vem das respostas UDP.
const PROBES=8;

function initCheck(){
 const my=++token;const cv=$('#cv'),ctx=cv.getContext('2d');let W=0,H=0,raf=0,alive=true,last=performance.now();
 const S={user:USERS.salvador,sc:'ok',phase:'idle',servers:[],packets:[],rings:[],chosen:-1,probes:[],running:false,tk:0,cam:{lon:0,lat:13,zoom:1},tgt:{lon:0,lat:13,zoom:1},arcA:[]};
 const land=[];for(let r=0;r<MAP.rows;r++){const row=MAP.grid[r];for(let c=0;c<MAP.cols;c++)if(row[c]==='1')land.push([-180+(c+.5)*MAP.step,MAP.latTop-(r+.5)*MAP.step])}
 const proj=(lat,lon)=>{const k=W/360*S.cam.zoom;return[W/2+(lon-S.cam.lon)*k,H/2-(lat-S.cam.lat)*k]};
 const arc=(a,b)=>{const[x0,y0]=proj(a.lat,a.lon),[x1,y1]=proj(b.lat,b.lon),dx=x1-x0,dy=y1-y0,d=Math.hypot(dx,dy)||1,h=clamp(d*.3,34,170);let nx=-dy/d,ny=dx/d;if(ny>0){nx=-nx;ny=-ny}return{x0,y0,x1,y1,cx:(x0+x1)/2+nx*h,cy:(y0+y1)/2+ny*h}};
 const bez=(A,t)=>{const u=1-t;return[u*u*A.x0+2*u*t*A.cx+t*t*A.x1,u*u*A.y0+2*u*t*A.cy+t*t*A.y1]};
 const dpr=Math.min(window.devicePixelRatio||1,2);
 function resize(){W=cv.parentElement.getBoundingClientRect().width;H=Math.round(W*(MAP.latTop-MAP.latBottom)/360);cv.width=W*dpr;cv.height=H*dpr;cv.style.height=H+'px';ctx.setTransform(dpr,0,0,dpr,0,0)}
 const ro=new ResizeObserver(resize);ro.observe(cv.parentElement);resize();
 const reset=()=>{S.servers=SERVERS.map(s=>({...s,rtt:null,state:'idle',lit:0}));S.arcA=SERVERS.map(()=>1);S.chosen=-1;S.probes=[];S.packets=[];S.rings=[]};
 const setPhase=(p,pill,t,sub)=>{S.phase=p;$('#mpill').textContent=pill;$('#mph').textContent=t;$('#mps').textContent=sub};
 const ulabel=()=>`${S.user.n}, ${S.user.c} · localização aproximada`;
 function renderList(){const mx=Math.max(...S.servers.map(s=>s.rtt||0),60);$('#srvlist').innerHTML=S.servers.map((s,i)=>`<div class="srv ${s.state==='probing'?'probing':''} ${S.chosen===i?'best':''} ${S.chosen>=0&&S.chosen!==i?'dim':''}"><div><b>${s.n}${S.chosen===i?'<span class="tag">Mais perto</span>':''}</b><small>${s.code}</small></div><div class="bar"><i style="width:${s.rtt?clamp(s.rtt/mx*100,6,100):0}%"></i></div><span class="ms">${s.rtt?Math.round(s.rtt):s.state==='probing'?'…':'—'}</span></div>`).join('')}
 function renderProbes(){const mx=Math.max(...S.probes.filter(p=>!p.lost).map(p=>p.ms),30);$('#probes').innerHTML=Array.from({length:PROBES},(_,i)=>{const p=S.probes[i];return p?(p.lost?`<div class="pr lost"><span></span><small>perdida</small></div>`:`<div class="pr"><span style="height:${clamp(p.ms/mx*100*.82,8,100)}%"></span><small>${Math.round(p.ms)}</small></div>`):`<div class="pr ghost"><span></span><small>${i+1}</small></div>`}).join('')}
 const stats=()=>{const ok=S.probes.filter(p=>!p.lost).map(p=>p.ms),lost=S.probes.filter(p=>p.lost).length;if(!ok.length)return null;const s=[...ok].sort((a,b)=>a-b),med=s.length%2?s[(s.length-1)/2]:(s[s.length/2-1]+s[s.length/2])/2;let j=0;for(let i=1;i<ok.length;i++)j+=Math.abs(ok[i]-ok[i-1]);return{med,jit:ok.length>1?j/(ok.length-1):0,loss:lost/S.probes.length*100,lost,n:S.probes.length}};
 const renderStats=()=>{const s=stats();if(!s)return;$('#sMed').textContent=Math.round(s.med);$('#sJit').textContent=fmt(s.jit,1);$('#sLoss').textContent=fmt(s.loss,0)};
 const fly=(si,dir,dur,o={})=>new Promise(res=>S.packets.push({si,dir,t0:performance.now(),dur,res,lost:!!o.lost,color:o.color||C.accentText}));
 const ring=(lat,lon,maxPx,dur,color)=>S.rings.push({lat,lon,maxPx,dur,color,t0:performance.now()});
 const frameCam=(a,b,zmax)=>{const span=Math.max(Math.abs(a.lon-b.lon),Math.abs(a.lat-b.lat)*W/H,6);S.tgt={lon:(a.lon+b.lon)/2,lat:(a.lat+b.lat)/2,zoom:clamp(360/(span*2.1),1,zmax)}};
 const wide=()=>{S.tgt={lon:0,lat:13,zoom:1}};
 const rtt=(s,i,k)=>{const r=rng(100+i*17+k*31),b=baseRtt(S.user,s);return S.sc==='unstable'?b+16+(r()<.35?r()*34:r()*10):b+(r()-.5)*(b<30?3:b*.04)};
 const btn=$('#detect'),redo=$('#redo');
 const btnState=(m)=>{redo.style.display=m==='done'?'':'none';btn.disabled=false;btn.onclick=null;
  if(m==='idle'){btn.textContent='Iniciar check';btn.onclick=run}
  if(m==='run'){btn.textContent='Cancelar';btn.className='btn';btn.style.cssText='min-height:48px';btn.onclick=()=>{idle();toast('Check cancelado')}}
  if(m==='done'){btn.textContent='Ver resultado';btn.className='btn primary';btn.style.cssText='min-height:48px;padding:0 24px';btn.onclick=()=>go('result')}
  if(m==='idle'){btn.className='btn primary';btn.style.cssText='min-height:48px;padding:0 24px'}}
 redo.onclick=run;
 async function run(){if(S.running)return;const tk=++S.tk;S.running=true;reset();renderList();renderProbes();$('#sMed').textContent=$('#sJit').textContent=$('#sLoss').textContent='—';$('#liveMs').textContent='—';$('#vfine').textContent='Esta rota não representa uma partida.';btnState('run');const ok=()=>tk===S.tk&&alive&&my===token;
  wide();setPhase('locate','Localizando','Localizando você',ulabel());
  for(let i=0;i<3;i++){ring(S.user.lat,S.user.lon,150,1500,C.accentText);await sleep(420);if(!ok())return}await sleep(450);if(!ok())return;
  setPhase('detect','Testando',`Testando ${SERVERS.length} regiões`,'Uma sonda por região, todas ao mesmo tempo');S.servers.forEach(s=>s.state='probing');renderList();
  await Promise.all(S.servers.map((s,i)=>(async()=>{await sleep(i*170);const r=rtt(s,i,-1),rt=clamp(r*8,900,2400);await fly(i,1,rt/2,{color:C.fg});if(!ok())return;ring(s.lat,s.lon,44,900,C.fg);await fly(i,-1,rt/2,{color:C.fg});if(!ok())return;s.rtt=r;s.state='done';s.lit=1;renderList()})()));
  if(!ok())return;
  const best=S.servers.reduce((m,s,i)=>s.rtt<S.servers[m].rtt?i:m,0);S.chosen=best;S.servers[best].state='chosen';renderList();
  setPhase('choose','Escolhida',`Mais perto: ${S.servers[best].n}`,`${Math.round(S.servers[best].rtt)} ms · ${S.servers[best].code}`);ring(S.servers[best].lat,S.servers[best].lon,90,1400,C.good);frameCam(S.user,S.servers[best],3.4);
  await sleep(1500);if(!ok())return;
  $('#vroute').textContent=`Rota até ${S.servers[best].n}`;renderProbes();
  const lossAt=S.sc==='loss'?[2,5]:[];
  for(let k=0;k<PROBES;k++){setPhase('measure','Medindo',`Medindo a rota até ${S.servers[best].n}`,`Sonda ${k+1} de ${PROBES}`);const s=S.servers[best],lost=lossAt.includes(k),ms=rtt(s,best,k),rt=clamp(ms*16,520,900);$('#liveMs').textContent='…';
   await fly(best,1,rt/2,{lost,color:C.accentText});if(!ok())return;
   if(lost){S.probes.push({lost:true});$('#liveMs').textContent='—'}else{ring(s.lat,s.lon,52,800,C.accentText);await fly(best,-1,rt/2,{color:C.good});if(!ok())return;ring(S.user.lat,S.user.lon,60,800,C.good);S.probes.push({ms});$('#liveMs').textContent=Math.round(ms)}
   renderProbes();renderStats();await sleep(160);if(!ok())return}
  const st=stats(),v=judge(st),sv=S.servers[best];
  RESULT={v,st,probes:S.probes.slice(),user:S.user,server:sv,km:km(S.user,sv),when:'agora'};
  setPhase('done',VERD[v].txt.replace(/^[●▲—]\s*/,''),v==='inconc'?'Medição inconclusiva':`Rota até ${sv.n} medida`,ulabel()+' → '+sv.code);
  $('#mpill').className='pill '+VERD[v].cls;$('#liveMs').textContent=st?Math.round(st.med):'—';$('#vfine').textContent=VERD[v].lead+' Esta rota não representa uma partida.';
  wide();S.running=false;btnState('done')}
 function idle(){S.tk++;S.running=false;reset();renderList();renderProbes();wide();setPhase('idle','Pronto','Pronto para detectar',ulabel());$('#mpill').className='pill accent';$('#liveMs').textContent='—';$('#vroute').textContent='Rota de referência';$('#sMed').textContent=$('#sJit').textContent=$('#sLoss').textContent='—';btnState('idle')}
 $$('[data-loc]').forEach(b=>b.onclick=()=>{S.user=USERS[b.dataset.loc];$$('[data-loc]').forEach(x=>x.setAttribute('aria-pressed',x===b));idle()});
 $$('[data-sc]').forEach(b=>b.onclick=()=>{S.sc=b.dataset.sc;$$('[data-sc]').forEach(x=>x.setAttribute('aria-pressed',x===b));idle()});

 const calm=()=>document.documentElement.classList.contains('calm')||matchMedia('(prefers-reduced-motion:reduce)').matches;
 function label(x,y,text,strong,above){ctx.font=`${strong?700:500} 12px "Google Sans Flex","Segoe UI",sans-serif`;const w=ctx.measureText(text).width+16,h=22;let lx=x+12,ly=y-h/2;if(above){lx=x-w/2;ly=y-h-14}else if(lx+w>W-8)lx=x-12-w;lx=clamp(lx,6,W-w-6);ly=clamp(ly,6,H-h-6);ctx.fillStyle=rgba(C.bg,.9);ctx.beginPath();ctx.roundRect(lx,ly,w,h,5);ctx.fill();ctx.lineWidth=1;ctx.strokeStyle='rgba(255,255,255,.14)';ctx.stroke();ctx.fillStyle='#F4F5F7';ctx.textBaseline='middle';ctx.fillText(text,lx+8,ly+h/2+.5)}
 function draw(now){if(!alive||my!==token)return;const dt=Math.min((now-last)/1000,.05);last=now;const kc=1-Math.exp(-dt*(calm()?30:3.2));for(const k of['lon','lat','zoom'])S.cam[k]+=(S.tgt[k]-S.cam[k])*kc;
  ctx.clearRect(0,0,W,H);const k=W/360*S.cam.zoom,sp=k*MAP.step,r0=clamp(sp*.30,1.1,4.6);
  const lights=[],u=proj(S.user.lat,S.user.lon);lights.push({x:u[0],y:u[1],r:46*clamp(S.cam.zoom,1,2),a:.55});
  S.servers.forEach(s=>{if(s.lit){const p=proj(s.lat,s.lon);lights.push({x:p[0],y:p[1],r:S.servers[S.chosen]===s?60:28,a:S.servers[S.chosen]===s?.8:.3})}});
  const arcs=S.servers.map(s=>arc(S.user,s));
  S.packets=S.packets.filter(p=>{const e=(now-p.t0)/p.dur;if(e>=1||(p.lost&&e>=.58)){p.res();return false}const A=arcs[p.si],t=ease(clamp(e,0,1)),tt=p.dir>0?t:1-t,pos=bez(A,tt);p._pos=pos;p._t=tt;p._e=e;lights.push({x:pos[0],y:pos[1],r:58,a:.95});return true});
  S.rings=S.rings.filter(g=>now-g.t0<g.dur);const rings=S.rings.map(g=>{const p=proj(g.lat,g.lon),e=(now-g.t0)/g.dur;return{x:p[0],y:p[1],r:easeOut(e)*g.maxPx,a:1-e,c:g.color}});
  ctx.fillStyle='rgba(138,147,160,.30)';ctx.beginPath();const boosted=[];
  for(let i=0;i<land.length;i++){const[x,y]=proj(land[i][1],land[i][0]);if(x<-6||x>W+6||y<-6||y>H+6)continue;let b=0;
   for(const L of lights){const dx=x-L.x,dy=y-L.y,d2=dx*dx+dy*dy;if(d2<L.r*L.r){const v=(1-Math.sqrt(d2)/L.r)*L.a;if(v>b)b=v}}
   for(const g of rings){const d=Math.abs(Math.hypot(x-g.x,y-g.y)-g.r);if(d<16){const v=(1-d/16)*g.a*.9;if(v>b)b=v}}
   if(b>.04)boosted.push(x,y,b);else{ctx.moveTo(x+r0,y);ctx.arc(x,y,r0,0,6.283)}}
  ctx.fill();for(let i=0;i<boosted.length;i+=3){const b=boosted[i+2];ctx.fillStyle=rgba(C.accentText,.3+b*.7);ctx.beginPath();ctx.arc(boosted[i],boosted[i+1],r0*(1+b*.55),0,6.283);ctx.fill()}
  S.servers.forEach((s,i)=>{const A=arcs[i],ch=S.chosen===i,fade=S.chosen>=0&&!ch;S.arcA[i]+=((fade?.1:1)-S.arcA[i])*Math.min(dt*4,1);ctx.save();ctx.globalAlpha=S.arcA[i];ctx.beginPath();ctx.moveTo(A.x0,A.y0);ctx.quadraticCurveTo(A.cx,A.cy,A.x1,A.y1);ctx.lineWidth=ch?2:1.2;ctx.setLineDash(ch?[2,7]:[3,7]);ctx.lineDashOffset=calm()?0:-now/60;ctx.strokeStyle=ch?rgba(C.good,.85):'rgba(138,147,160,.5)';ctx.stroke();ctx.restore()});
  for(const g of rings){ctx.beginPath();ctx.arc(g.x,g.y,Math.max(g.r,.1),0,6.283);ctx.lineWidth=1.6;ctx.strokeStyle=rgba(g.c,g.a*.8);ctx.stroke()}
  if(!calm())for(const p of S.packets){const A=arcs[p.si],col=p.color,seg=22,tail=.2;
   for(let j=0;j<seg;j++){const t1=p.dir>0?Math.max(0,p._t-tail*(j+1)/seg):Math.min(1,p._t+tail*(j+1)/seg),t0=p.dir>0?Math.max(0,p._t-tail*j/seg):Math.min(1,p._t+tail*j/seg),a=bez(A,t0),b=bez(A,t1);ctx.beginPath();ctx.moveTo(a[0],a[1]);ctx.lineTo(b[0],b[1]);ctx.lineWidth=3.4*(1-j/seg)+.6;ctx.lineCap='round';ctx.strokeStyle=rgba(col,(1-j/seg)*(p.lost&&p._e>.4?clamp(1-(p._e-.4)/.18,0,1):1));ctx.stroke()}
   const[hx,hy]=p._pos,g=ctx.createRadialGradient(hx,hy,0,hx,hy,16);g.addColorStop(0,rgba(col,.9));g.addColorStop(1,rgba(col,0));ctx.fillStyle=g;ctx.beginPath();ctx.arc(hx,hy,16,0,6.283);ctx.fill();ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(hx,hy,3,0,6.283);ctx.fill();
   if(p.lost&&p._e>.5){ctx.strokeStyle=rgba(C.coral,clamp((p._e-.5)/.08,0,1));ctx.lineWidth=2.4;ctx.beginPath();ctx.moveTo(hx-6,hy-6);ctx.lineTo(hx+6,hy+6);ctx.moveTo(hx+6,hy-6);ctx.lineTo(hx-6,hy+6);ctx.stroke()}}
  const tms=now/1000;
  S.servers.forEach((s,i)=>{const[x,y]=proj(s.lat,s.lon),ch=S.chosen===i,dim=S.chosen>=0&&!ch;ctx.save();ctx.globalAlpha=dim?.35:1;
   if(ch&&!calm()){const ph=(tms*.9)%1;ctx.beginPath();ctx.arc(x,y,6+ph*22,0,6.283);ctx.strokeStyle=rgba(C.good,(1-ph)*.7);ctx.lineWidth=2;ctx.stroke()}
   ctx.beginPath();ctx.arc(x,y,ch?7:5,0,6.283);ctx.fillStyle=s.lit?(ch?'#22C55E':'#F4F5F7'):'#15181E';ctx.fill();ctx.lineWidth=2;ctx.strokeStyle=ch?'#22C55E':'rgba(138,147,160,.9)';ctx.stroke();label(x,y,s.n+(s.rtt?` · ${Math.round(s.rtt)} ms`:''),ch);ctx.restore()});
  if(!calm()){const ph=(tms*.8)%1;ctx.beginPath();ctx.arc(u[0],u[1],7+ph*26,0,6.283);ctx.strokeStyle=rgba(C.accentText,(1-ph)*.7);ctx.lineWidth=2;ctx.stroke()}
  ctx.beginPath();ctx.arc(u[0],u[1],7,0,6.283);ctx.fillStyle='#7C3AED';ctx.shadowColor='#7C3AED';ctx.shadowBlur=18;ctx.fill();ctx.shadowBlur=0;ctx.lineWidth=2.5;ctx.strokeStyle='#F4F5F7';ctx.stroke();label(u[0],u[1],'Você · '+S.user.n,true,true);
  raf=requestAnimationFrame(draw)}
 idle();raf=requestAnimationFrame(draw);
 return()=>{alive=false;cancelAnimationFrame(raf);ro.disconnect();S.tk++}
}
go('home');
