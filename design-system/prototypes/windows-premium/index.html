<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lagcheck ORBIT — Game Library & Conexão</title>
<style>
/* Fontes Canônicas Lagcheck Web DS (WOFF2 auto-hospedadas) */
@font-face {
  font-family: 'Barlow';
  font-weight: 400;
  font-style: normal;
  font-display: swap;
  src: url('assets/barlow-latin-400-normal.woff2') format('woff2');
}
@font-face {
  font-family: 'Barlow';
  font-weight: 500;
  font-style: normal;
  font-display: swap;
  src: url('assets/barlow-latin-500-normal.woff2') format('woff2');
}
@font-face {
  font-family: 'Barlow Semi Condensed';
  font-weight: 700;
  font-style: normal;
  font-display: swap;
  src: url('assets/barlow-semi-condensed-latin-700-normal.woff2') format('woff2');
}
@font-face {
  font-family: 'Barlow Semi Condensed';
  font-weight: 800;
  font-style: normal;
  font-display: swap;
  src: url('assets/barlow-semi-condensed-latin-800-normal.woff2') format('woff2');
}
@font-face {
  font-family: 'Chakra Petch';
  font-weight: 600;
  font-style: normal;
  font-display: swap;
  src: url('assets/chakra-petch-latin-600-normal.woff2') format('woff2');
}

/* Tokens de Design Lagcheck + ORBIT */
:root {
  --stage: #060709;
  --deep: #0B0D10;
  --surface: #15181E;
  --panel: #1E232B;
  --line: rgba(244, 245, 247, 0.10);
  --line-strong: rgba(244, 245, 247, 0.18);

  --text-primary: #F4F5F7;
  --text-secondary: #8A93A0;
  --text-tertiary: #606873;

  /* Roxo Gamer Lagcheck */
  --purple: #7C3AED;
  --purple-hover: #8B5CF6;
  --purple-light: #A78BFA;
  --purple-subtle: rgba(124, 58, 237, 0.15);

  /* Verde Esportivo ORBIT (Referência do mockup) */
  --orbit-green: #22C55E;
  --orbit-green-light: #4ADE80;
  --orbit-green-subtle: rgba(34, 197, 94, 0.15);
  --orbit-lime: #A3E635;

  /* Semânticos */
  --ready: #22C55E;
  --caution: #F59E0B;
  --coral: #FF5A36;

  --font-body: 'Barlow', -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
  --font-heading: 'Barlow Semi Condensed', 'Barlow', -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
  --font-metric: 'Chakra Petch', 'Cascadia Mono', Consolas, monospace;
  --font-mono: 'Cascadia Mono', Consolas, ui-monospace, monospace;

  --ease: cubic-bezier(0.2, 0, 0, 1);
  --dur-control: 160ms;
}

* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--stage);
  color: var(--text-primary);
  font-family: var(--font-body);
  font-size: 14px;
  line-height: 1.5;
  min-width: 1024px;
  overflow: hidden;
  -webkit-font-smoothing: antialiased;
}

button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }

:focus-visible {
  outline: 2px solid var(--purple-light);
  outline-offset: 2px;
}

/* Estrutura Desktop */
.app {
  height: 100vh;
  display: grid;
  grid-template-rows: 56px 1fr;
  grid-template-columns: 210px 1fr;
  background: var(--stage);
}

/* ==========================================================================
   1. TOPBAR (Barra Superior com Busca Ampla e Controles)
   ========================================================================== */
.topbar {
  grid-column: 1 / -1;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 16px 0 20px;
  background: var(--stage);
  border-bottom: 1px solid var(--line);
  user-select: none;
  z-index: 20;
}
.tb-left {
  display: flex;
  align-items: center;
  gap: 12px;
  width: 190px;
}
.orbit-brand {
  display: flex;
  align-items: center;
  gap: 9px;
  text-decoration: none;
}
.orbit-mark {
  width: 32px;
  height: 24px;
}
.orbit-brand-text {
  display: flex;
  flex-direction: column;
}
.orbit-title {
  font-family: var(--font-heading);
  font-size: 20px;
  font-weight: 800;
  line-height: 1;
  letter-spacing: .04em;
  color: #fff;
}
.orbit-sub {
  font-family: var(--font-mono);
  font-size: 9px;
  font-weight: 700;
  letter-spacing: .12em;
  color: var(--text-tertiary);
  margin-top: 2px;
}

/* Barra de Busca Central */
.tb-search-wrap {
  flex: 1;
  max-width: 520px;
  margin: 0 24px;
  position: relative;
  display: flex;
  align-items: center;
}
.tb-search-icon {
  position: absolute;
  left: 14px;
  width: 16px;
  height: 16px;
  color: var(--text-tertiary);
  pointer-events: none;
}
.tb-search-input {
  width: 100%;
  height: 38px;
  padding: 0 16px 0 40px;
  border-radius: 20px;
  background: var(--surface);
  border: 1px solid var(--line-strong);
  color: var(--text-primary);
  font-size: 13.5px;
  transition: all var(--dur-control) var(--ease);
}
.tb-search-input::placeholder {
  color: var(--text-tertiary);
}
.tb-search-input:focus {
  outline: none;
  border-color: var(--purple-light);
  background: var(--panel);
}

/* Ações Direitas da Topbar */
.tb-right {
  display: flex;
  align-items: center;
  gap: 14px;
}
.tb-icon-btn {
  width: 36px;
  height: 36px;
  border-radius: 50%;
  border: 0;
  background: transparent;
  display: grid;
  place-items: center;
  color: var(--text-secondary);
  position: relative;
  transition: background var(--dur-control) var(--ease);
}
.tb-icon-btn:hover { background: var(--surface); color: var(--text-primary); }
.tb-notify-dot {
  position: absolute;
  top: 7px;
  right: 7px;
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: var(--orbit-green);
}
.tb-avatar {
  width: 32px;
  height: 32px;
  border-radius: 50%;
  background: #2A313D;
  border: 1.5px solid var(--line-strong);
  display: grid;
  place-items: center;
  font-family: var(--font-heading);
  font-weight: 800;
  font-size: 13px;
  color: var(--text-primary);
  cursor: pointer;
}
.tb-window-controls {
  display: flex;
  align-items: center;
  margin-left: 8px;
}
.tb-win-btn {
  width: 42px;
  height: 38px;
  border: 0;
  background: transparent;
  display: grid;
  place-items: center;
  color: var(--text-secondary);
  transition: background var(--dur-control) var(--ease);
}
.tb-win-btn:hover { background: var(--panel); color: var(--text-primary); }
.tb-win-btn.close:hover { background: #C42B1C; color: #fff; }

/* ==========================================================================
   2. SIDEBAR (Navegação Rica em Seções)
   ========================================================================== */
.sidebar {
  background: var(--stage);
  border-right: 1px solid var(--line);
  padding: 16px 10px 16px 14px;
  display: flex;
  flex-direction: column;
  overflow-y: auto;
  gap: 20px;
}
.nav-section {
  display: flex;
  flex-direction: column;
  gap: 2px;
}
.nav-section-title {
  font-size: 12px;
  font-weight: 500;
  color: var(--text-tertiary);
  padding: 4px 10px;
  margin-bottom: 2px;
}
.sidebar-link {
  display: flex;
  align-items: center;
  gap: 12px;
  height: 38px;
  padding: 0 12px;
  border-radius: 8px;
  border: 1px solid transparent;
  background: transparent;
  color: var(--text-secondary);
  font-size: 13.5px;
  font-weight: 500;
  text-align: left;
  transition: all var(--dur-control) var(--ease);
}
.sidebar-link:hover {
  background: var(--surface);
  color: var(--text-primary);
}
.sidebar-link.active {
  background: var(--orbit-green-subtle);
  color: var(--orbit-green-light);
  font-weight: 600;
}
.sidebar-link.active svg {
  color: var(--orbit-green);
}
.sidebar-badge {
  margin-left: auto;
  font-family: var(--font-mono);
  font-size: 10px;
  font-weight: 700;
  color: var(--text-tertiary);
  background: var(--panel);
  padding: 1px 6px;
  border-radius: 4px;
}
.sidebar-foot {
  margin-top: auto;
  padding-top: 10px;
  border-top: 1px solid var(--line);
}

/* ==========================================================================
   3. STAGE (Palco Principal com Banner Hero & Biblioteca)
   ========================================================================== */
.stage {
  background: var(--deep);
  overflow-y: auto;
  position: relative;
  display: flex;
  flex-direction: column;
}

/* Barra de Inspeção dos 6 Estados */
.state-toolbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 6px 28px;
  background: var(--surface);
  border-bottom: 1px solid var(--line);
  font-size: 12px;
}
.state-toolbar-label {
  font-family: var(--font-mono);
  font-size: 10px;
  font-weight: 700;
  letter-spacing: .08em;
  text-transform: uppercase;
  color: var(--text-tertiary);
}
.state-pills { display: flex; gap: 6px; }
.state-btn {
  height: 26px;
  padding: 0 9px;
  border: 1px solid var(--line-strong);
  border-radius: 6px;
  background: transparent;
  color: var(--text-secondary);
  font-family: var(--font-mono);
  font-size: 10px;
  font-weight: 700;
  transition: all var(--dur-control) var(--ease);
}
.state-btn:hover { background: var(--panel); color: var(--text-primary); }
.state-btn[aria-pressed="true"] {
  background: var(--panel);
  border-color: var(--purple);
  color: var(--text-primary);
  box-shadow: 0 0 0 1px var(--purple);
}

.stage-content {
  padding: 24px 28px 48px;
  display: flex;
  flex-direction: column;
  gap: 24px;
  max-width: 1280px;
  width: 100%;
  margin: 0 auto;
}

/* ==========================================================================
   4. HERO BANNER CINEMATOGRÁFICO WIDESCREEN
   ========================================================================== */
.hero-banner {
  position: relative;
  width: 100%;
  height: 380px;
  border-radius: 18px;
  overflow: hidden;
  border: 1px solid var(--line);
  box-shadow: 0 16px 40px rgba(0, 0, 0, 0.45);
}
.hero-backdrop {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  object-position: center 30%;
  display: block;
}
.hero-gradient-overlay {
  position: absolute;
  inset: 0;
  background: linear-gradient(90deg,
    rgba(11, 13, 16, 0.96) 0%,
    rgba(11, 13, 16, 0.88) 35%,
    rgba(11, 13, 16, 0.35) 70%,
    rgba(11, 13, 16, 0.15) 100%
  );
  z-index: 1;
}
.hero-inner {
  position: relative;
  z-index: 2;
  height: 100%;
  padding: 34px 38px;
  display: flex;
  flex-direction: column;
  justify-content: center;
  max-width: 580px;
}
.hero-logo-row {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 12px;
}
.hero-game-badge {
  font-family: var(--font-mono);
  font-size: 11px;
  font-weight: 700;
  color: var(--orbit-green-light);
  letter-spacing: .08em;
  text-transform: uppercase;
}
.hero-title {
  margin: 0 0 12px;
  font-family: var(--font-heading);
  font-size: 42px;
  font-weight: 800;
  line-height: 1.05;
  letter-spacing: -.02em;
  color: #fff;
  text-shadow: 0 2px 14px rgba(0,0,0,0.7);
}
.hero-desc {
  margin: 0 0 20px;
  color: var(--text-secondary);
  font-size: 14.5px;
  line-height: 1.5;
  text-shadow: 0 1px 8px rgba(0,0,0,0.8);
}

/* Botões de Ação do Hero */
.hero-actions {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 22px;
}
.btn-hero-play {
  display: inline-flex;
  align-items: center;
  gap: 9px;
  height: 48px;
  padding: 0 28px;
  border-radius: 12px;
  background: var(--orbit-lime);
  color: #0B0D10;
  border: 0;
  font-family: var(--font-heading);
  font-size: 17px;
  font-weight: 800;
  letter-spacing: .02em;
  box-shadow: 0 8px 24px rgba(163, 230, 53, 0.35);
  transition: all var(--dur-control) var(--ease);
}
.btn-hero-play:hover { background: #BEF264; transform: translateY(-1px); }
.btn-hero-play:active { transform: scale(0.98); }

.btn-hero-test {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  height: 48px;
  padding: 0 22px;
  border-radius: 12px;
  background: var(--purple);
  color: #fff;
  border: 0;
  font-family: var(--font-body);
  font-size: 14px;
  font-weight: 700;
  box-shadow: 0 6px 20px rgba(124, 58, 237, 0.35);
  transition: all var(--dur-control) var(--ease);
}
.btn-hero-test:hover { background: var(--purple-hover); transform: translateY(-1px); }

.btn-hero-icon {
  width: 48px;
  height: 48px;
  border-radius: 12px;
  background: rgba(30, 35, 43, 0.7);
  border: 1px solid var(--line-strong);
  color: var(--text-primary);
  display: grid;
  place-items: center;
  backdrop-filter: blur(8px);
  transition: all var(--dur-control) var(--ease);
}
.btn-hero-icon:hover { background: var(--panel); border-color: var(--text-secondary); }
.btn-hero-icon[aria-pressed="true"] { color: var(--purple-light); border-color: var(--purple-light); }

/* Metadados na Base do Hero */
.hero-meta-row {
  display: flex;
  align-items: center;
  gap: 18px;
  font-family: var(--font-mono);
  font-size: 11px;
  color: var(--text-secondary);
}
.hero-meta-item {
  display: flex;
  align-items: center;
  gap: 6px;
}

/* Setas do Carrossel */
.hero-nav-arrow {
  position: absolute;
  top: 50%;
  transform: translateY(-50%);
  width: 40px;
  height: 40px;
  border-radius: 50%;
  background: rgba(11, 13, 16, 0.65);
  border: 1px solid var(--line-strong);
  color: #fff;
  display: grid;
  place-items: center;
  z-index: 3;
  backdrop-filter: blur(6px);
  transition: background var(--dur-control) var(--ease);
}
.hero-nav-arrow:hover { background: rgba(30, 35, 43, 0.9); }
.hero-nav-arrow.prev { left: 16px; }
.hero-nav-arrow.next { right: 16px; }

/* Paginação no canto */
.hero-pagination {
  position: absolute;
  right: 28px;
  bottom: 24px;
  z-index: 3;
  display: flex;
  align-items: center;
  gap: 6px;
}
.hero-page-dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: var(--text-tertiary);
  transition: all var(--dur-control) var(--ease);
}
.hero-page-dot.active {
  width: 22px;
  border-radius: 4px;
  background: var(--orbit-green);
}

/* ==========================================================================
   5. SEÇÃO: SUA BIBLIOTECA (Filtros em Pílula e Grade de Cards)
   ========================================================================== */
.library-section {
  display: flex;
  flex-direction: column;
  gap: 14px;
}
.library-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
}
.library-title-group {
  display: flex;
  align-items: center;
  gap: 10px;
}
.library-accent-bar {
  width: 3.5px;
  height: 20px;
  border-radius: 2px;
  background: var(--orbit-green);
}
.library-title {
  margin: 0;
  font-family: var(--font-heading);
  font-size: 22px;
  font-weight: 800;
  letter-spacing: -.01em;
  color: var(--text-primary);
}

/* Filtros em Pílulas */
.library-pills {
  display: flex;
  align-items: center;
  gap: 8px;
}
.library-pill-btn {
  height: 32px;
  padding: 0 14px;
  border-radius: 16px;
  background: var(--surface);
  border: 1px solid var(--line-strong);
  color: var(--text-secondary);
  font-family: var(--font-body);
  font-size: 13px;
  font-weight: 600;
  transition: all var(--dur-control) var(--ease);
}
.library-pill-btn:hover { border-color: var(--text-secondary); color: var(--text-primary); }
.library-pill-btn.active {
  border-color: var(--orbit-green);
  color: var(--orbit-green-light);
  background: var(--orbit-green-subtle);
}

.library-sort {
  font-size: 12.5px;
  color: var(--text-secondary);
}

/* Grade de Cards de Jogos (Proporção ~16:10 / Capa) */
.games-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 16px;
}
.game-card {
  position: relative;
  aspect-ratio: 16 / 10;
  border-radius: 14px;
  overflow: hidden;
  border: 1px solid var(--line);
  background: var(--surface);
  cursor: pointer;
  transition: all var(--dur-control) var(--ease);
}
.game-card:hover {
  border-color: var(--line-strong);
  transform: translateY(-2px);
  box-shadow: 0 8px 24px rgba(0,0,0,0.5);
}
.game-card.active {
  border-color: var(--orbit-green);
  box-shadow: 0 0 0 2px var(--orbit-green), 0 8px 28px rgba(34, 197, 94, 0.25);
}
.game-card-img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}
.game-card-overlay {
  position: absolute;
  inset: 0;
  background: linear-gradient(180deg, rgba(11,13,16,0.1) 40%, rgba(11,13,16,0.85) 100%);
  display: flex;
  flex-direction: column;
  justify-content: flex-end;
  padding: 12px 14px;
}
.game-card-installed-badge {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 3px 8px;
  border-radius: 6px;
  background: rgba(11, 13, 16, 0.85);
  backdrop-filter: blur(4px);
  font-family: var(--font-mono);
  font-size: 10px;
  font-weight: 700;
  color: var(--orbit-green-light);
  letter-spacing: .04em;
  width: fit-content;
  border: 1px solid rgba(34, 197, 94, 0.3);
}

/* ==========================================================================
   6. SEÇÃO COCKPIT DE DIAGNÓSTICO LAGCHECK
   ========================================================================== */
.cockpit-section {
  border-top: 1px solid var(--line);
  padding-top: 24px;
  display: flex;
  flex-direction: column;
  gap: 16px;
}
.cockpit-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.metric-strip {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  border-top: 1px solid var(--line);
  border-bottom: 1px solid var(--line);
  margin-top: 4px;
}
.metric-col {
  padding: 14px 14px 14px 0;
  min-width: 0;
}
.metric-col + .metric-col {
  padding-left: 18px;
  border-left: 1px solid var(--line);
}
.metric-label {
  display: block;
  font-family: var(--font-mono);
  font-size: 10.5px;
  font-weight: 700;
  letter-spacing: .08em;
  text-transform: uppercase;
  color: var(--text-tertiary);
}
.metric-val {
  display: block;
  margin-top: 4px;
  font-family: var(--font-metric);
  font-size: 28px;
  font-weight: 600;
  line-height: 1;
  color: var(--text-primary);
  font-variant-numeric: tabular-nums;
}
.metric-val small { font-size: 13px; color: var(--text-secondary); margin-left: 2px; }
.metric-note { display: block; margin-top: 4px; font-size: 11.5px; color: var(--text-secondary); }

/* ==========================================================================
   7. TELAS DOS 6 ESTADOS DE DIAGNÓSTICO DO LAGCHECK
   ========================================================================== */
.progress-rail {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 8px;
  padding: 12px 0;
  border-bottom: 1px solid var(--line);
}
.step-item {
  display: flex;
  align-items: center;
  gap: 8px;
  font-family: var(--font-mono);
  font-size: 11px;
  font-weight: 700;
  letter-spacing: .08em;
  text-transform: uppercase;
  color: var(--text-tertiary);
}
.step-item::before {
  content: '';
  width: 7px;
  height: 7px;
  border-radius: 50%;
  border: 1px solid currentColor;
}
.step-item[data-status="done"] { color: var(--text-secondary); }
.step-item[data-status="done"]::before { background: currentColor; }
.step-item[data-status="active"] { color: var(--purple-light); }
.step-item[data-status="active"]::before { border-color: var(--purple); background: var(--purple); }

.map-canvas-wrap {
  position: relative;
  width: 100%;
  aspect-ratio: 2.2 / 1;
  background: var(--deep);
  border: 1px solid var(--line);
  border-radius: 14px;
  overflow: hidden;
}
.map-canvas-wrap canvas { width: 100%; height: 100%; display: block; }
.map-overlay-phase {
  position: absolute;
  left: 20px;
  top: 18px;
  display: flex;
  align-items: center;
  gap: 12px;
  background: rgba(11, 13, 16, 0.85);
  border: 1px solid var(--line);
  padding: 8px 14px;
  border-radius: 8px;
}
.map-overlay-telemetry {
  position: absolute;
  right: 20px;
  top: 18px;
  text-align: right;
  background: rgba(11, 13, 16, 0.85);
  border: 1px solid var(--line);
  padding: 8px 16px;
  border-radius: 8px;
}
.map-overlay-telemetry .live-ms {
  font-family: var(--font-metric);
  font-size: 30px;
  font-weight: 600;
  color: var(--text-primary);
}

.status-dot {
  width: 9px;
  height: 9px;
  border-radius: 50%;
  flex: none;
}
.status-dot.ready { background: var(--ready); }
.status-dot.caution { background: var(--caution); border-radius: 2px; }
.status-dot.coral { background: var(--coral); border-radius: 0; transform: rotate(45deg); }
.status-dot.neutral { background: transparent; border: 1.5px solid var(--text-secondary); }

.btn-primary {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  min-height: 50px;
  padding: 0 28px;
  border: 0;
  border-radius: 12px;
  background: var(--purple);
  color: #fff;
  font-size: 15px;
  font-weight: 700;
  box-shadow: 0 6px 20px rgba(124, 58, 237, 0.35);
  transition: all var(--dur-control) var(--ease);
}
.btn-primary:hover { background: var(--purple-hover); }

.btn-secondary {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  min-height: 42px;
  padding: 0 18px;
  border: 1px solid var(--line-strong);
  border-radius: 10px;
  background: transparent;
  color: var(--text-primary);
  font-size: 13.5px;
  font-weight: 600;
}
.btn-secondary:hover { border-color: var(--text-secondary); background: var(--surface); }

.btn-text {
  border: 0;
  background: transparent;
  color: var(--purple-light);
  font-weight: 600;
  font-size: 13.5px;
}
.btn-text:hover { text-decoration: underline; }

/* Toast */
.toast-notice {
  position: fixed;
  bottom: 24px;
  left: 50%;
  transform: translate(-50%, 20px);
  background: var(--panel);
  border: 1px solid var(--line-strong);
  padding: 10px 20px;
  border-radius: 8px;
  font-size: 14px;
  font-weight: 500;
  color: var(--text-primary);
  box-shadow: 0 10px 28px rgba(0,0,0,0.5);
  opacity: 0;
  pointer-events: none;
  transition: all var(--dur-control) var(--ease);
  z-index: 100;
}
.toast-notice.show { opacity: 1; transform: translate(-50%, 0); }

/* SVG icons */
svg.i {
  width: 18px;
  height: 18px;
  fill: none;
  stroke: currentColor;
  stroke-width: 2;
  stroke-linecap: round;
  stroke-linejoin: round;
  flex: none;
}
</style>

  const t = $('#toast');
  t.textContent = msg;
  t.classList.add('show');

}

  return GAMES_CATALOG.find(g => g.id === selectedGameId) || GAMES_CATALOG[0];
}

/* ==========================================================================

   ========================================================================== */
function renderApp() {
  const container = $('#stage-content');
  $$('.state-btn').forEach(btn => {
    btn.setAttribute('aria-pressed', String(btn.dataset.setState === currentState));
  });

  switch (currentState) {
    case 'ready':
      container.innerHTML = getHubViewHtml();
      break;
    case 'measuring':
      container.innerHTML = getMeasuringViewHtml();
      initMeasuringAnimation();
      break;
    case 'result-good':
      container.innerHTML = getResultGoodHtml();
      break;
    case 'result-unstable':
      container.innerHTML = getResultUnstableHtml();
      break;
    case 'result-inconclusive':
      container.innerHTML = getResultInconclusiveHtml();
      break;
    case 'error':
      container.innerHTML = getErrorViewHtml();
      break;
  }
  bindEvents();
}

function bindEvents() {
  // Clique nos cards de jogos
  $$('.game-card').forEach(card => {

      selectedGameId = card.dataset.cardId;
      renderApp();

      renderApp();
    };
  });

  // Setas do carrossel do Hero
  const prevBtn = $('#hero-prev');
  const nextBtn = $('#hero-next');
  if (prevBtn) {
    prevBtn.onclick = () => {
      const idx = GAMES_CATALOG.findIndex(g => g.id === selectedGameId);
      const newIdx = (idx - 1 + GAMES_CATALOG.length) % GAMES_CATALOG.length;
      selectedGameId = GAMES_CATALOG[newIdx].id;
      renderApp();
    };
  }
  if (nextBtn) {
    nextBtn.onclick = () => {
      const idx = GAMES_CATALOG.findIndex(g => g.id === selectedGameId);
      const newIdx = (idx + 1) % GAMES_CATALOG.length;
      selectedGameId = GAMES_CATALOG[newIdx].id;
      renderApp();
    };
  }

  // Botão Jogar
  const btnPlay = $('#btn-play');
  if (btnPlay) {
    btnPlay.onclick = () => {

      showToast(`Iniciando ${g.title} via ${g.platform}...`);

  // Botão Favoritar

    btnFav.onclick = () => {
      const g = getSelectedGame();
      g.isFavorite = !g.isFavorite;
      renderApp();
      showToast(g.isFavorite ? `${g.title} adicionado aos Favoritos` : `${g.title} removido dos Favoritos`);

  // Botão Testar Conexão no Hero
  const btnHeroTest = $('#btn-test-route');
  if (btnHeroTest) {
    btnHeroTest.onclick = () => {
      currentState = 'measuring';
      renderApp();

  // Botão Iniciar Diagnóstico no Cockpit

  if (btnQuickCheck) {
    btnQuickCheck.onclick = () => {
      currentState = 'measuring';
      renderApp();
    };
  }

  // Botão Cancelar

  if (btnCancel) {
    btnCancel.onclick = () => {
      if (measureInterval) clearInterval(measureInterval);
      currentState = 'ready';
      renderApp();
      showToast('Diagnóstico cancelado');

  // Botão Repetir
  const btnRepeat = $('#btn-repeat');
  if (btnRepeat) {
    btnRepeat.onclick = () => {
      currentState = 'measuring';
      renderApp();
    };

    btnCopy.onclick = () => {
      showToast('Resumo copiado para colar no Discord!');
    };
  }
}

/* ==========================================================================
   CANVAS DE ROTA DA TELA MEDINDO
   ========================================================================== */
function initMeasuringAnimation() {
  const cv = $('#map-cv');
  if (!cv) return;
  const ctx = cv.getContext('2d');
  let w = cv.parentElement.clientWidth;
  let h = cv.parentElement.clientHeight;
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  cv.width = w * dpr;
  cv.height = h * dpr;
  ctx.scale(dpr, dpr);

  let step = 0;
  if (measureInterval) clearInterval(measureInterval);

  measureInterval = setInterval(() => {
    step++;
    const msEl = $('#measure-live-ms');
    const jitterEl = $('#live-jitter');
    const loadEl = $('#live-load');
    const lossEl = $('#live-loss');

    if (step <= 4) {
      if (msEl) msEl.innerHTML = `${17 + Math.floor(Math.random() * 3)}<small>ms</small>`;
    } else if (step <= 8) {
      $('#measure-phase-title').textContent = 'Testando variação sob carga paralela';
      $('#measure-phase-sub').textContent = 'Simulando tráfego de download e upload';
      if ($$('.step-item')[1]) $$('.step-item')[1].dataset.status = 'done';
      if ($$('.step-item')[2]) $$('.step-item')[2].dataset.status = 'active';
      if (msEl) msEl.innerHTML = `${20 + Math.floor(Math.random() * 4)}<small>ms</small>`;
      if (jitterEl) jitterEl.innerHTML = `2<small>ms</small>`;
      if (loadEl) loadEl.innerHTML = `+4<small>ms</small>`;
    } else if (step >= 11) {
      clearInterval(measureInterval);
      currentState = 'result-good';
      renderApp();
      showToast('Diagnóstico finalizado');
      return;
    }

    drawMapFrame(ctx, w, h);
  }, 450);

  drawMapFrame(ctx, w, h);
}

function drawMapFrame(ctx, w, h) {
  ctx.clearRect(0, 0, w, h);
  ctx.fillStyle = '#0B0D10';
  ctx.fillRect(0, 0, w, h);

  ctx.fillStyle = 'rgba(138, 147, 160, 0.22)';
  const cols = 40;
  const rows = 18;
  const gapX = w / cols;
  const gapY = h / rows;

  for (let c = 0; c < cols; c++) {
    for (let r = 0; r < rows; r++) {
      const isLand = (c > 8 && c < 18 && r > 3 && r < 15) ||
                     (c >= 18 && c < 28 && r > 2 && r < 12) ||
                     (c >= 28 && c < 37 && r > 2 && r < 14);
      if (isLand) {
        ctx.beginPath();
        ctx.arc(c * gapX + gapX/2, r * gapY + gapY/2, 1.4, 0, Math.PI * 2);
        ctx.fill();
      }
    }
  }

  const userX = w * 0.35;
  const userY = h * 0.72;
  const srvX = w * 0.42;
  const srvY = h * 0.68;

  ctx.beginPath();
  ctx.moveTo(userX, userY);
  ctx.quadraticCurveTo((userX + srvX)/2, userY - 40, srvX, srvY);
  ctx.strokeStyle = '#7C3AED';
  ctx.lineWidth = 1.8;
  ctx.setLineDash([3, 4]);
  ctx.stroke();
  ctx.setLineDash([]);

  ctx.beginPath();
  ctx.arc(userX, userY, 5, 0, Math.PI * 2);
  ctx.fillStyle = '#7C3AED';
  ctx.fill();
  ctx.strokeStyle = '#F4F5F7';
  ctx.lineWidth = 1.5;
  ctx.stroke();

  ctx.beginPath();
  ctx.arc(srvX, srvY, 5, 0, Math.PI * 2);
  ctx.fillStyle = '#22C55E';
  ctx.fill();
  ctx.strokeStyle = '#0B0D10';
  ctx.lineWidth = 1.5;
  ctx.stroke();

  ctx.font = '600 11px "Barlow", sans-serif';
  ctx.fillStyle = '#F4F5F7';
  ctx.fillText('Você (São Paulo)', userX - 45, userY + 18);
  ctx.fillText('AWS sa-east-1', srvX + 10, srvY + 4);
}

$$('.state-btn').forEach(btn => {

$$('.sidebar-link').forEach(link => {

    const nav = link.dataset.nav;
    $$('.sidebar-link').forEach(l => l.classList.remove('active'));
    link.classList.add('active');

    if (nav === 'home') {
      currentState = 'ready';
      renderApp();
    } else if (nav === 'library') {
      currentLibraryFilter = 'ALL';
      currentState = 'ready';
      renderApp();
    } else if (nav === 'favorites') {
      currentLibraryFilter = 'FAVORITES';
      currentState = 'ready';
      renderApp();
    } else if (nav === 'installed') {
      currentLibraryFilter = 'INSTALLED';
      currentState = 'ready';
      renderApp();
    } else {
      showToast(`Filtro ${link.textContent.trim()} selecionado`);
    }
  };
});

$('#global-search').oninput = (e) => {
  const query = e.target.value.toLowerCase().trim();
  const match = GAMES_CATALOG.find(g => g.title.toLowerCase().includes(query));
  if (match) {
    selectedGameId = match.id;
    if (currentState === 'ready') renderApp();
  }
};
