<svg viewBox="0 0 540 120" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="p1-wm-title p1-wm-desc">
  <title id="p1-wm-title">LagCheck Wordmark — Proposta 1 (Radar Check)</title>
  <desc id="p1-wm-desc">Wordmark horizontal do LagCheck com símbolo de radar/pulso e tipografia nativa contrastante.</desc>
  <defs>
    <linearGradient id="p1-wm-accent" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0062E3" />
      <stop offset="100%" stop-color="#5AC8FA" />
    </linearGradient>
  </defs>

  <!-- Símbolo Compacto à Esquerda (80x80) -->
  <g transform="translate(60, 60)">
    <!-- Arcos de Radar -->
    <path d="M -34 -8 A 38 38 0 0 1 34 -8" 
          fill="none" stroke="url(#p1-wm-accent)" stroke-width="7" stroke-linecap="round" opacity="0.4" />
    <path d="M -24 0 A 26 26 0 0 1 24 0" 
          fill="none" stroke="url(#p1-wm-accent)" stroke-width="8" stroke-linecap="round" opacity="0.75" />
    <!-- Checkmark Integrado -->
    <path d="M -16 6 L -3 19 L 24 -8" 
          fill="none" stroke="url(#p1-wm-accent)" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Tipografia "lagcheck" -->
  <g transform="translate(130, 72)" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', system-ui, sans-serif" font-size="46" letter-spacing="-1.5">
    <!-- "lag" em Branco Puro -->
    <text x="0" y="0" font-weight="800" fill="#FFFFFF">lag</text>
    <!-- "check" em Azul iOS -->
    <text x="74" y="0" font-weight="700" fill="url(#p1-wm-accent)">check</text>
  </g>
</svg>
