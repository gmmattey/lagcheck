<svg viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="p2-sunset-title p2-sunset-desc">
  <title id="p2-sunset-title">LagCheck App Icon — Pulse Gauge (Sunset Coral)</title>
  <desc id="p2-sunset-desc">Ícone do app LagCheck com o anel de score em gradiente Rosa Coral e Laranja Sunset inspirado no Apple Fitness sobre fundo preto.</desc>
  <defs>
    <radialGradient id="p2-sunset-bg" cx="50%" cy="45%" r="75%">
      <stop offset="0%" stop-color="#260B12" />
      <stop offset="50%" stop-color="#0F0502" />
      <stop offset="100%" stop-color="#000000" />
    </radialGradient>
    <linearGradient id="p2-sunset-ring" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF2D55" />
      <stop offset="50%" stop-color="#FF623A" />
      <stop offset="100%" stop-color="#FF9F0A" />
    </linearGradient>
    <filter id="p2-sunset-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="24" stdDeviation="34" flood-color="#FF4A45" flood-opacity="0.45" />
    </filter>
  </defs>
  <rect width="1024" height="1024" rx="224" fill="url(#p2-sunset-bg)" />
  <rect width="1024" height="1024" rx="224" fill="none" stroke="rgba(255,255,255,0.09)" stroke-width="2" />
  <g transform="translate(512, 512)" filter="url(#p2-sunset-glow)">
    <path d="M -170 170 A 240 240 0 1 1 170 170" fill="none" stroke="#1C1A19" stroke-width="52" stroke-linecap="round" />
    <path d="M -170 170 A 240 240 0 1 1 130 200" fill="none" stroke="url(#p2-sunset-ring)" stroke-width="52" stroke-linecap="round" />
    <path d="M -150 15 L -60 15 L -20 -60 L 30 70 L 65 -15 L 140 -15" fill="none" stroke="url(#p2-sunset-ring)" stroke-width="26" stroke-linecap="round" stroke-linejoin="round" opacity="0.4" />
    <path d="M -70 10 L -10 70 L 110 -50" fill="none" stroke="#FFFFFF" stroke-width="48" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>
