<svg viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="p3-title p3-desc">
  <title id="p3-title">LagCheck App Icon — Proposta 3 (Monograma LC)</title>
  <desc id="p3-desc">Ícone do app LagCheck com monograma moderno das letras L e C entrelaçadas em gradiente azul elétrico sobre fundo preto profundo.</desc>
  <defs>
    <!-- Fundo Preto Puro com Gradiente Angular Suave -->
    <radialGradient id="p3-bg" cx="50%" cy="35%" r="80%">
      <stop offset="0%" stop-color="#0E1A38" />
      <stop offset="55%" stop-color="#040814" />
      <stop offset="100%" stop-color="#000000" />
    </radialGradient>

    <!-- Gradiente da Letra L (Fita Base) -->
    <linearGradient id="p3-l-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2E7CFF" />
      <stop offset="100%" stop-color="#0047BA" />
    </linearGradient>

    <!-- Gradiente da Letra C / Check (Fita Superior de Luz) -->
    <linearGradient id="p3-c-grad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#007AFF" />
      <stop offset="50%" stop-color="#40B5FF" />
      <stop offset="100%" stop-color="#A5ECFF" />
    </linearGradient>

    <!-- Sombra Direcional Suave entre Fitas -->
    <filter id="p3-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="24" stdDeviation="30" flood-color="#0055D6" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Fundo do App Icon -->
  <rect width="1024" height="1024" rx="224" fill="url(#p3-bg)" />
  <rect width="1024" height="1024" rx="224" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="2" />

  <!-- Monograma Centralizado LC -->
  <g transform="translate(512, 512)" filter="url(#p3-shadow)">
    <!-- Letra L (Traço Vertical e Base Horizontal com curvatura contínua) -->
    <path d="M -160 -210 L -160 140 C -160 190, -120 220, -70 220 L 140 220 C 170 220, 190 200, 190 175 C 190 150, 170 130, 140 130 L -70 130 C -80 130, -85 125, -85 115 L -85 -210 C -85 -235, -105 -255, -122.5 -255 C -145 -255, -160 -235, -160 -210 Z" 
          fill="url(#p3-l-grad)" opacity="0.85" />

    <!-- Letra C & Checkmark Dinâmico (Arco e Ângulo Frontal) -->
    <path d="M 120 -150 C 70 -195, -10 -210, -70 -180 C -160 -130, -180 -10, -140 80 C -110 150, -40 200, 40 200 C 110 200, 180 150, 200 80 C 205 60, 190 40, 170 40 C 150 40, 135 55, 125 75 C 105 120, 55 140, 0 125 C -50 110, -90 45, -70 -25 C -50 -95, 10 -130, 75 -115 C 95 -110, 115 -125, 120 -150 Z" 
          fill="url(#p3-c-grad)" />

    <!-- Checkmark Elegante no Coração do Monograma -->
    <path d="M -60 20 L 10 90 L 180 -80" 
          fill="none" stroke="#FFFFFF" stroke-width="48" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>
