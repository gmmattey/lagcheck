<svg viewBox="0 0 540 120" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="p3-wm-title p3-wm-desc">
  <title id="p3-wm-title">LagCheck Wordmark — Proposta 3 (Monograma LC)</title>
  <desc id="p3-wm-desc">Wordmark horizontal do LagCheck com monograma LC moderno e tipografia premium editorial.</desc>
  <defs>
    <linearGradient id="p3-wm-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#40B5FF" />
      <stop offset="100%" stop-color="#0062E3" />
    </linearGradient>
  </defs>

  <!-- Monograma LC Compacto à Esquerda (80x80) -->
  <g transform="translate(60, 60) scale(0.22)">
    <!-- Letra L -->
    <path d="M -130 -160 L -130 110 C -130 150, -100 170, -60 170 L 110 170 C 130 170, 150 155, 150 135 C 150 115, 130 100, 110 100 L -60 100 L -60 -160 Z" 
          fill="#0055D6" opacity="0.8" />
    <!-- Letra C & Checkmark -->
    <path d="M -50 10 L 0 60 L 140 -80" 
          fill="none" stroke="url(#p3-wm-grad)" stroke-width="42" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Tipografia "LAGCHECK" -->
  <g transform="translate(130, 72)" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', system-ui, sans-serif">
    <text x="0" y="0" font-size="42" font-weight="800" letter-spacing="1.5" fill="#FFFFFF">LAG</text>
    <text x="105" y="0" font-size="42" font-weight="600" letter-spacing="1.5" fill="url(#p3-wm-grad)">CHECK</text>
  </g>
</svg>
