<svg viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="p1-title p1-desc">
  <title id="p1-title">LagCheck App Icon — Proposta 1 (Radar Check)</title>
  <desc id="p1-desc">Ícone do app LagCheck com arcos concêntricos de radar e pulso que culminam em um checkmark de alta precisão em gradiente azul elétrico Apple.</desc>
  <defs>
    <!-- Gradiente de Fundo Apple Dark Mode -->
    <radialGradient id="p1-bg" cx="50%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#0B1C3D" />
      <stop offset="50%" stop-color="#040915" />
      <stop offset="100%" stop-color="#000000" />
    </radialGradient>
    
    <!-- Gradiente do Símbolo Azul Elétrico -->
    <linearGradient id="p1-accent" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0055D6" />
      <stop offset="50%" stop-color="#007AFF" />
      <stop offset="100%" stop-color="#5AC8FA" />
    </linearGradient>

    <!-- Gradiente de Brilho Suave do Check -->
    <linearGradient id="p1-check-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#70D7FF" />
      <stop offset="60%" stop-color="#007AFF" />
      <stop offset="100%" stop-color="#004EC4" />
    </linearGradient>

    <!-- Filtro de Elevação Suave Apple -->
    <filter id="p1-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="28" flood-color="#007AFF" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Fundo do App Icon (1024x1024) -->
  <rect width="1024" height="1024" rx="224" fill="url(#p1-bg)" />

  <!-- Borda Sutil Apple HIG -->
  <rect width="1024" height="1024" rx="224" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="2" />

  <!-- Grupo Centralizado do Símbolo com Glow -->
  <g transform="translate(512, 512)" filter="url(#p1-glow)">
    
    <!-- Arco Superior de Radar (Alcance 1) -->
    <path d="M -260 -60 A 280 280 0 0 1 260 -60" 
          fill="none" stroke="url(#p1-accent)" stroke-width="44" stroke-linecap="round" opacity="0.35" />

    <!-- Arco Médio de Radar (Alcance 2) -->
    <path d="M -180 -10 A 190 190 0 0 1 180 -10" 
          fill="none" stroke="url(#p1-accent)" stroke-width="48" stroke-linecap="round" opacity="0.7" />

    <!-- Círculo Base / Núcleo do Pulso -->
    <circle cx="0" cy="40" r="110" fill="none" stroke="url(#p1-accent)" stroke-width="40" opacity="0.9" />

    <!-- Checkmark Forte de Verificação / Conclusão de Rota -->
    <path d="M -110 50 L -20 140 L 190 -70" 
          fill="none" stroke="url(#p1-check-grad)" stroke-width="58" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Ponto de Origem / Pulso de Ping -->
    <circle cx="-110" cy="50" r="16" fill="#FFFFFF" opacity="0.9" />
  </g>
</svg>
