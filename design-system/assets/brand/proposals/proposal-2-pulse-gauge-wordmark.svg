<svg viewBox="0 0 540 120" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="p2-wm-title p2-wm-desc">
  <title id="p2-wm-title">LagCheck Wordmark — Proposta 2 (Pulse Gauge)</title>
  <desc id="p2-wm-desc">Wordmark horizontal do LagCheck com anel de score verde-azul e tipografia Apple editorial.</desc>
  <defs>
    <linearGradient id="p2-wm-grad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34C759" />
      <stop offset="60%" stop-color="#30B0C7" />
      <stop offset="100%" stop-color="#007AFF" />
    </linearGradient>
  </defs>

  <!-- Símbolo de Anel Compacto à Esquerda -->
  <g transform="translate(60, 60)">
    <!-- Trilha de fundo -->
    <path d="M -22 22 A 32 32 0 1 1 22 22" 
          fill="none" stroke="#2C2C2E" stroke-width="8" stroke-linecap="round" />
    <!-- Anel ativo -->
    <path d="M -22 22 A 32 32 0 1 1 16 26" 
          fill="none" stroke="url(#p2-wm-grad)" stroke-width="8" stroke-linecap="round" />
    <!-- Checkmark interno -->
    <path d="M -10 1 L -2 9 L 14 -7" 
          fill="none" stroke="#FFFFFF" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Tipografia "LagCheck" -->
  <g transform="translate(130, 72)" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', system-ui, sans-serif" font-size="46" letter-spacing="-1.2">
    <text x="0" y="0" font-weight="700" fill="#FFFFFF">Lag</text>
    <text x="76" y="0" font-weight="700" fill="url(#p2-wm-grad)">Check</text>
  </g>
</svg>
