<svg viewBox="0 0 540 120" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="p2-coral-wm-title p2-coral-wm-desc">
  <title id="p2-coral-wm-title">LagCheck Wordmark — Pulse Gauge (Coral / Laranja)</title>
  <desc id="p2-coral-wm-desc">Wordmark horizontal do LagCheck com anel de pulso em gradiente Coral e Laranja sobre tipografia SF Pro.</desc>
  <defs>
    <linearGradient id="p2-coral-wm-grad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF3823" />
      <stop offset="50%" stop-color="#FF6B35" />
      <stop offset="100%" stop-color="#FFAB2E" />
    </linearGradient>
  </defs>

  <!-- Símbolo de Anel Compacto à Esquerda (80x80) -->
  <g transform="translate(60, 60)">
    <!-- Trilha de fundo -->
    <path d="M -22 22 A 32 32 0 1 1 22 22" 
          fill="none" stroke="#2C2826" stroke-width="8" stroke-linecap="round" />
    <!-- Anel ativo em Coral/Laranja -->
    <path d="M -22 22 A 32 32 0 1 1 16 26" 
          fill="none" stroke="url(#p2-coral-wm-grad)" stroke-width="8" stroke-linecap="round" />
    <!-- Checkmark interno branco puro -->
    <path d="M -10 1 L -2 9 L 14 -7" 
          fill="none" stroke="#FFFFFF" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Tipografia "LagCheck" -->
  <g transform="translate(130, 72)" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', system-ui, sans-serif" font-size="46" letter-spacing="-1.2">
    <text x="0" y="0" font-weight="700" fill="#FFFFFF">Lag</text>
    <text x="76" y="0" font-weight="700" fill="url(#p2-coral-wm-grad)">Check</text>
  </g>
</svg>
