<svg viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="p2-coral-title p2-coral-desc">
  <title id="p2-coral-title">LagCheck App Icon — Pulse Gauge (Coral / Laranja)</title>
  <desc id="p2-coral-desc">Ícone do app LagCheck com o anel de score determinístico de 270 graus em gradiente Coral Elétrico e Laranja Solar sobre fundo OLED preto com profundidade térmica.</desc>
  <defs>
    <!-- Fundo Preto Puro com Brilho Térmico Sutil -->
    <radialGradient id="p2-coral-bg" cx="50%" cy="45%" r="75%">
      <stop offset="0%" stop-color="#240D05" />
      <stop offset="50%" stop-color="#0F0502" />
      <stop offset="100%" stop-color="#000000" />
    </radialGradient>
    
    <!-- Gradiente Coral Vibrante -> Laranja Sunset -> Âmbar Solar -->
    <linearGradient id="p2-coral-ring" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF3823" />
      <stop offset="45%" stop-color="#FF6B35" />
      <stop offset="100%" stop-color="#FFAB2E" />
    </linearGradient>

    <!-- Gradiente Secundário do Pulso -->
    <linearGradient id="p2-coral-pulse" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF6B35" />
      <stop offset="100%" stop-color="#FFAB2E" />
    </linearGradient>

    <!-- Filtro de Elevação e Glow Quente Apple HIG -->
    <filter id="p2-coral-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="24" stdDeviation="34" flood-color="#FF5E2E" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Fundo do Ícone (1024x1024) com Raio Apple 224pt -->
  <rect width="1024" height="1024" rx="224" fill="url(#p2-coral-bg)" />
  <rect width="1024" height="1024" rx="224" fill="none" stroke="rgba(255,255,255,0.09)" stroke-width="2" />

  <!-- Grupo Central do Anel e Pulso -->
  <g transform="translate(512, 512)" filter="url(#p2-coral-glow)">
    <!-- Trilha Escura do Anel (Fundo) -->
    <path d="M -170 170 A 240 240 0 1 1 170 170" 
          fill="none" stroke="#1C1A19" stroke-width="52" stroke-linecap="round" />

    <!-- Anel Ativo em Gradiente Coral / Laranja -->
    <path d="M -170 170 A 240 240 0 1 1 130 200" 
          fill="none" stroke="url(#p2-coral-ring)" stroke-width="52" stroke-linecap="round" />

    <!-- Pulso Dinâmico Central (Onda de Baixa Latência) -->
    <path d="M -150 15 L -60 15 L -20 -60 L 30 70 L 65 -15 L 140 -15" 
          fill="none" stroke="url(#p2-coral-pulse)" stroke-width="26" stroke-linecap="round" stroke-linejoin="round" opacity="0.4" />

    <!-- Checkmark Forte Central de Confirmação (Branco Puro com reflexo suave) -->
    <path d="M -70 10 L -10 70 L 110 -50" 
          fill="none" stroke="#FFFFFF" stroke-width="48" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>
