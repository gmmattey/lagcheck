<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="sym-title sym-desc">
  <title id="sym-title">Símbolo LagCheck</title>
  <desc id="sym-desc">Símbolo compacto Pulse Gauge da marca LagCheck: anel determinístico de 270 graus em gradiente Coral Solar com checkmark de precisão.</desc>
  <defs>
    <linearGradient id="sym-coral-grad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF3823" />
      <stop offset="50%" stop-color="#FF6B35" />
      <stop offset="100%" stop-color="#FFAB2E" />
    </linearGradient>
  </defs>
  <g transform="translate(120, 120)">
    <!-- Trilha de fundo -->
    <path d="M -50 50 A 70 70 0 1 1 50 50" 
          fill="none" stroke="#2C2826" stroke-width="16" stroke-linecap="round" />
    <!-- Anel ativo em Coral Solar -->
    <path d="M -50 50 A 70 70 0 1 1 38 58" 
          fill="none" stroke="url(#sym-coral-grad)" stroke-width="16" stroke-linecap="round" />
    <!-- Checkmark central -->
    <path d="M -22 3 L -4 21 L 32 -15" 
          fill="none" stroke="#FFFFFF" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>
