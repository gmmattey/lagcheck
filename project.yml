name: Nolaggy
options:
  bundleIdPrefix: com.nolaggy
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "26.0"
  developmentLanguage: en
  knownRegions:
    - Base
    - en
    - pt-BR
    - es
settings:
  base:
    SWIFT_VERSION: "6.0"
    TARGETED_DEVICE_FAMILY: "1"
    CODE_SIGNING_ALLOWED: YES
    DEVELOPMENT_TEAM: 2Z4T8228GR
    MARKETING_VERSION: "1.0.2"
    CURRENT_PROJECT_VERSION: "3"
packages:
  GoogleMobileAds:
    url: https://github.com/googleads/swift-package-manager-google-mobile-ads.git
    exactVersion: 13.11.0
  GoogleUserMessagingPlatform:
    url: https://github.com/googleads/swift-package-manager-google-user-messaging-platform.git
    exactVersion: 3.1.0
targets:
  NolaggyDesign:
    type: framework
    platform: iOS
    dependencies:
      - target: NolaggyDomain
    sources:
      - path: Sources/NolaggyDesign
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nolaggy.design
        GENERATE_INFOPLIST_FILE: YES
  NolaggyDomain:
    type: framework
    platform: iOS
    sources:
      - path: Sources/NolaggyDomain
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nolaggy.domain
        GENERATE_INFOPLIST_FILE: YES
  NolaggyApplication:
    type: framework
    platform: iOS
    dependencies:
      - target: NolaggyDomain
    sources:
      - path: Sources/NolaggyApplication
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nolaggy.application
        GENERATE_INFOPLIST_FILE: YES
  NolaggyInfrastructure:
    type: framework
    platform: iOS
    dependencies:
      - target: NolaggyApplication
      - target: NolaggyDomain
    sources:
      - path: Sources/NolaggyInfrastructure
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nolaggy.infrastructure
        GENERATE_INFOPLIST_FILE: YES
  Nolaggy:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    dependencies:
      - target: NolaggyDesign
      - target: NolaggyDomain
      - target: NolaggyApplication
      - target: NolaggyInfrastructure
      - target: LagCheckWidget
      - target: LagCheckClip
      - package: GoogleMobileAds
        product: GoogleMobileAds
      - package: GoogleUserMessagingPlatform
        product: GoogleUserMessagingPlatform
      - sdk: AppIntents.framework
      - sdk: StoreKit.framework
      - sdk: WidgetKit.framework
    sources:
      - path: Sources/NolaggyApp
      # Credencial de desenvolvimento local, ignorada pelo Git. O serviço
      # lê este recurso somente no bundle Debug instalado neste Mac.
      - path: Secrets/Secrets.plist
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lagcheck.app
        # Release identity. Xcode maps these values into the generated
        # CFBundleShortVersionString and CFBundleVersion entries.
        MARKETING_VERSION: "1.0.2"
        CURRENT_PROJECT_VERSION: "3"
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_CFBundleDisplayName: "LagCheck"
        INFOPLIST_KEY_CFBundleName: "LagCheck"
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # URLs públicas só devem ser fornecidas pelo build/release depois de
        # publicadas e testadas. Valores vazios aparecem como indisponíveis.
        LAGCHECK_SUPPORT_URL: "https://linka-speedtest.web.app/lagcheck/suporte"
        LAGCHECK_PRIVACY_POLICY_URL: "https://linka-speedtest.web.app/lagcheck/privacidade"
        INFOPLIST_KEY_LagCheckSupportURL: "$(LAGCHECK_SUPPORT_URL)"
        INFOPLIST_KEY_LagCheckPrivacyPolicyURL: "$(LAGCHECK_PRIVACY_POLICY_URL)"
        INFOPLIST_KEY_NolaggySupportURL: "$(LAGCHECK_SUPPORT_URL)"
        INFOPLIST_KEY_NolaggyPrivacyPolicyURL: "$(LAGCHECK_PRIVACY_POLICY_URL)"
        PRIVACY_MANIFEST_FILE: Sources/NolaggyApp/Resources/PrivacyInfo.xcprivacy
        CODE_SIGN_ENTITLEMENTS: Sources/NolaggyApp/Nolaggy.entitlements
        LAGCHECK_ADS_ENABLED: YES
      configs:
        Debug:
          LAGCHECK_ADMOB_APP_ID: ca-app-pub-3940256099942544~1458002511
        Release:
          LAGCHECK_ADMOB_APP_ID: ca-app-pub-5542349230926522~8215990145
    preBuildScripts:
      - name: Validate iOS AdMob configuration
        script: |
          set -eu
          test "$CONFIGURATION" != Release || {
            test "$LAGCHECK_ADMOB_APP_ID" = 'ca-app-pub-5542349230926522~8215990145'
            test "$LAGCHECK_ADS_ENABLED" = YES -o "$LAGCHECK_ADS_ENABLED" = NO
            for unit in 4055030074 4883886853 2936380361 7813302529; do
              grep -Fq "ca-app-pub-5542349230926522/$unit" "$SRCROOT/Sources/NolaggyApp/Ads/NativeAdSlot.swift"
            done
          }
          test "$CONFIGURATION" != Debug || test "$LAGCHECK_ADMOB_APP_ID" = 'ca-app-pub-3940256099942544~1458002511'
    info:
      path: Sources/NolaggyApp/Info.plist
      properties:
        CFBundleURLTypes:
          - CFBundleURLName: com.lagcheck.app
            CFBundleURLSchemes:
              - lagcheck
  LagCheckWidget:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    dependencies:
      - target: NolaggyDomain
      - target: NolaggyDesign
      - target: NolaggyInfrastructure
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
    sources:
      - path: Sources/LagCheckWidget
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lagcheck.app.widget
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: "LagCheck Widget"
        MARKETING_VERSION: "1.0.2"
        CURRENT_PROJECT_VERSION: "3"
        CODE_SIGN_ENTITLEMENTS: Sources/LagCheckWidget/LagCheckWidget.entitlements
  LagCheckClip:
    type: application.on-demand-install-capable
    platform: iOS
    deploymentTarget: "17.0"
    dependencies:
      - target: NolaggyDomain
      - target: NolaggyDesign
      - target: NolaggyApplication
      - target: NolaggyInfrastructure
      - sdk: SwiftUI.framework
    sources:
      - path: Sources/LagCheckClip
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lagcheck.app.Clip
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: "LagCheck Clip"
        INFOPLIST_KEY_CFBundleName: "LagCheck Clip"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        MARKETING_VERSION: "1.0.2"
        CURRENT_PROJECT_VERSION: "3"
        CODE_SIGN_ENTITLEMENTS: Sources/LagCheckClip/LagCheckClip.entitlements
  NolaggyDomainTests:
    type: bundle.unit-test
    platform: iOS
    dependencies:
      - target: NolaggyDomain
    sources:
      - path: Tests/NolaggyDomainTests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
  NolaggyApplicationTests:
    type: bundle.unit-test
    platform: iOS
    dependencies:
      - target: NolaggyApplication
      - target: NolaggyDomain
      - target: NolaggyInfrastructure
    sources:
      - path: Tests/NolaggyApplicationTests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
  NolaggyInfrastructureTests:
    type: bundle.unit-test
    platform: iOS
    dependencies:
      - target: NolaggyInfrastructure
    sources:
      - path: Tests/NolaggyInfrastructureTests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
  NolaggyUITests:
    type: bundle.ui-testing
    platform: iOS
    dependencies:
      - target: Nolaggy
    sources:
      - path: Tests/NolaggyUITests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  NolaggyUnitTests:
    build:
      targets:
        NolaggyDomainTests: [test]
        NolaggyApplicationTests: [test]
        NolaggyInfrastructureTests: [test]
    test:
      targets:
        - NolaggyDomainTests
        - NolaggyApplicationTests
        - NolaggyInfrastructureTests
  NolaggyCoreTests:
    build:
      targets:
        NolaggyApplicationTests: [test]
        NolaggyDomainTests: [test]
        NolaggyInfrastructureTests: [test]
        NolaggyUITests: [test]
    test:
      targets:
        - NolaggyDomainTests
        - NolaggyApplicationTests
        - NolaggyInfrastructureTests
        - NolaggyUITests
  Nolaggy:
    build:
      targets:
        Nolaggy: all
        NolaggyDomainTests: [test]
        NolaggyApplicationTests: [test]
        NolaggyInfrastructureTests: [test]
        NolaggyUITests: [test]
    test:
      targets:
        - NolaggyDomainTests
        - NolaggyApplicationTests
        - NolaggyInfrastructureTests
        - NolaggyUITests
