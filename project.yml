name: Nolaggy
options:
  bundleIdPrefix: com.nolaggy
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "26.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    TARGETED_DEVICE_FAMILY: "1"
    CODE_SIGNING_ALLOWED: YES
    DEVELOPMENT_TEAM: 2Z4T8228GR
targets:
  NolaggyDesign:
    type: framework
    platform: iOS
    sources:
      - path: Sources/NolaggyDesign
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nolaggy.design
        GENERATE_INFOPLIST_FILE: YES
  NolaggyDomain:
    type: framework
    platform: iOS
    sources:
      - path: Sources/NolaggyDomain
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nolaggy.domain
        GENERATE_INFOPLIST_FILE: YES
  NolaggyApplication:
    type: framework
    platform: iOS
    dependencies:
      - target: NolaggyDomain
    sources:
      - path: Sources/NolaggyApplication
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nolaggy.application
        GENERATE_INFOPLIST_FILE: YES
  NolaggyInfrastructure:
    type: framework
    platform: iOS
    dependencies:
      - target: NolaggyApplication
      - target: NolaggyDomain
    sources:
      - path: Sources/NolaggyInfrastructure
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nolaggy.infrastructure
        GENERATE_INFOPLIST_FILE: YES
  Nolaggy:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    dependencies:
      - target: NolaggyDesign
      - target: NolaggyDomain
      - target: NolaggyApplication
      - target: NolaggyInfrastructure
    sources:
      - path: Sources/NolaggyApp
    resources:
      - path: Sources/NolaggyApp/Resources/Fonts
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nolaggy.app
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_NolaggySupportURL: ""
        INFOPLIST_KEY_NolaggyPrivacyPolicyURL: ""
  NolaggyDomainTests:
    type: bundle.unit-test
    platform: iOS
    dependencies:
      - target: NolaggyDomain
    sources:
      - path: Tests/NolaggyDomainTests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
  NolaggyApplicationTests:
    type: bundle.unit-test
    platform: iOS
    dependencies:
      - target: NolaggyApplication
      - target: NolaggyDomain
      - target: NolaggyInfrastructure
    sources:
      - path: Tests/NolaggyApplicationTests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
  NolaggyInfrastructureTests:
    type: bundle.unit-test
    platform: iOS
    dependencies:
      - target: NolaggyInfrastructure
    sources:
      - path: Tests/NolaggyInfrastructureTests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
  NolaggyUITests:
    type: bundle.ui-testing
    platform: iOS
    dependencies:
      - target: Nolaggy
    sources:
      - path: Tests/NolaggyUITests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  NolaggyUnitTests:
    build:
      targets:
        NolaggyDomainTests: [test]
        NolaggyApplicationTests: [test]
        NolaggyInfrastructureTests: [test]
    test:
      targets:
        - NolaggyDomainTests
        - NolaggyApplicationTests
        - NolaggyInfrastructureTests
  NolaggyCoreTests:
    build:
      targets:
        NolaggyApplicationTests: [test]
        NolaggyDomainTests: [test]
        NolaggyInfrastructureTests: [test]
        NolaggyUITests: [test]
    test:
      targets:
        - NolaggyDomainTests
        - NolaggyApplicationTests
        - NolaggyInfrastructureTests
        - NolaggyUITests
  Nolaggy:
    build:
      targets:
        Nolaggy: all
        NolaggyDomainTests: [test]
        NolaggyApplicationTests: [test]
        NolaggyInfrastructureTests: [test]
        NolaggyUITests: [test]
    test:
      targets:
        - NolaggyDomainTests
        - NolaggyApplicationTests
        - NolaggyInfrastructureTests
        - NolaggyUITests
